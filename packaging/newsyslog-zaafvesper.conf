# ZAAFVesper sensor logs, installed as /etc/newsyslog.d/zaafvesper.conf.
# Rotates the LaunchDaemon's stdout/stderr files at 10 MB and keeps 5
# generations, root:wheel 0600. Alert files (alerts-*.jsonl) are not .log
# files: ZAAFVesper rotates those itself.
#
# Flags: G = the name is a glob, N = no process to signal (launchd owns the
# descriptors). Rotated files are not compressed: launchd keeps writing to
# the descriptor it opened, so lines written after a rotation land in the
# rotated file (*.log.0) until the daemon restarts, and must stay readable
# there.
#
# logfilename                    [owner:group]  mode  count  size(KB)  when  flags
/var/log/zaafvesper/*.log        root:wheel     600   5      10240     *     GN
