# Drop-in for sysmon.service: /etc/systemd/system/sysmon.service.d/zaafvesper.conf
# journald rate-limits each service (by default 10 000 messages per 30 s);
# Sysmon events above that would be dropped before ZAAFVesper sees them
# (ZAAFVesper reports such gaps as sysmon_events_dropped). This turns the
# rate limit off for Sysmon only.
[Service]
LogRateLimitIntervalSec=0
