# Drop-in that makes ZAAFVesper read Sysmon for Linux instead of using its own
# eBPF programs. Install it as
#   /etc/systemd/system/zaafvesper.service.d/source-sysmon.conf
# then: systemctl daemon-reload && systemctl restart zaafvesper
# (packaging/linux/README.md, "Using Sysmon for Linux instead").
[Unit]
After=sysmon.service
Wants=sysmon.service

[Service]
ExecStart=
ExecStart=/usr/local/sbin/zaafvesper run --source sysmon --config /usr/local/etc/zaafvesper/zaafvesper.yml --rules /usr/local/etc/zaafvesper/rules --output-dir /var/lib/zaafvesper/logs --no-console
