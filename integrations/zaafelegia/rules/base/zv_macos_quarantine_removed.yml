title: Quarantine attribute removed with xattr (macOS)
id: 1a478c3f-0a0d-4050-9b93-d6d71805d24e
name: zv_macos_quarantine_removed
status: experimental
description: Matches only process_creation records (EventID 1), since ZAAFElegia does not yet filter by logsource. xattr deletes com.apple.quarantine, so Gatekeeper does not assess the file.
author: ZAAFVesper project
references:
  - https://attack.mitre.org/techniques/T1553/001/
tags:
  - attack.defense-evasion
  - attack.t1553.001
logsource:
  product: macos
  category: process_creation
detection:
  selection:
    EventID: 1
    Image: /usr/bin/xattr
    CommandLine|contains|all:
      - ' -d '
      - com.apple.quarantine
  condition: selection
falsepositives:
  - Developers clearing quarantine on their own downloads
level: low
