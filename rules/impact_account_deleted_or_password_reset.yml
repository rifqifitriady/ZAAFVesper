name: User account deleted or its password reset with dscl or sysadminctl
id: 1d7f4b85-6c3e-4a92-8b10-e5a9c2f7d364
version: 1.0.0
platforms: [macos]
description: |
  dscl deleted a record under /Users or reset a user's password (-passwd), or
  sysadminctl deleted a user. Attackers remove or lock out accounts to stop the owner
  from responding. MDM tools and administrators do this too, rarely, and usually from a
  management agent that can be excluded.
labels:
  tactic.id: TA0040
  tactic.name: Impact
  technique.id: T1531
  technique.name: Account Access Removal
references:
  - https://attack.mitre.org/techniques/T1531/
condition: >
  spawn_process
  and (
    (ps.name = 'dscl' and ps.args in ('-delete', 'delete', '-passwd', 'passwd') and ps.cmdline icontains '/Users/')
    or (ps.name = 'sysadminctl' and ps.args iin ('-deleteUser', '-resetPasswordFor'))
  )
output: "%ps.exe (pid %ps.pid, parent %ps.parent.exe) removed or reset an account: %ps.cmdline"
severity: medium
action: []
tests:
  atomic: [4d938c43-2fe8-4d70-a5b3-5bf239aa7846, d3812c4e-30ee-466a-a0aa-07e355b561d6]
min-engine-version: 0.1.0
