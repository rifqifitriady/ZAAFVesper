name: Shutdown or reboot run without a terminal
id: 8b6d3f20-1e7c-4a59-9c84-5d2f7e0a1b36
version: 1.0.0
platforms: [macos, linux]
description: |
  shutdown, reboot, halt or poweroff ran without a controlling terminal. Malware and
  wipers reboot or power off a host to finish an attack or to cause disruption. The
  macOS Apple menu does not run these commands, and an administrator who types them has
  a tty. On Linux the Sysmon source does not report a tty, so every run matches there.
labels:
  tactic.id: TA0040
  tactic.name: Impact
  technique.id: T1529
  technique.name: System Shutdown/Reboot
references:
  - https://attack.mitre.org/techniques/T1529/
condition: >
  spawn_process
  and base(ps.exe) in ('shutdown', 'reboot', 'halt', 'poweroff')
  and not ps.tty imatches '/dev/*'
output: "%ps.exe (pid %ps.pid, parent %ps.parent.exe) ran without a terminal: %ps.cmdline"
severity: low
action: []
tests:
  atomic: [6326dbc4-444b-4c04-88f4-27e94d0327cb, 4963a81e-a3ad-4f02-adda-812343b351de, 47d0b042-a918-40ab-8cf9-150ffe919027, 918f70ab-e1ef-49ff-bc57-b27021df84dd, 78f92e14-f1e9-4446-b3e9-f1b921f2459e, 73a90cd2-48a2-4ac5-8594-2af35fa909fa, 61303105-ff60-427b-999e-efb90b314e41]
min-engine-version: 0.1.0
