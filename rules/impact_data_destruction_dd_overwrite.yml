name: File or disk overwritten with zeros or random data by dd
id: 4f2b8d61-9e3a-4c07-b5d1-6a8e0c3f2b19
version: 1.0.0
platforms: [macos, linux]
description: |
  dd wrote zeros or random data (if=/dev/zero, /dev/urandom or /dev/random) to a target
  outside temp folders and /dev/null, or wrote its standard input (no if=) straight to a
  disk device. Wipers destroy data this way. A temp target that climbs out of the temp
  folder (of=/tmp/../...) is not treated as temp. Creating an empty disk image with dd in
  a home folder also matches; such runs are rare. Creating a swap file (/swapfile,
  /swap.img, /var/swap*) is excluded. A second of= is never excluded (GNU dd writes to
  the last one, so an excluded first target can hide the real one). Not covered: other
  overwrite tools (shred, srm, cat /dev/zero > file through a shell redirection), or a
  temp path that is a symlink to a real file (the target is judged by its name).
labels:
  tactic.id: TA0040
  tactic.name: Impact
  technique.id: T1485
  technique.name: Data Destruction
references:
  - https://attack.mitre.org/techniques/T1485/
condition: >
  spawn_process
  and ps.name = 'dd'
  and (
    (ps.args imatches ('if=/dev/zero', 'if=/dev/urandom', 'if=/dev/random')
     and ps.args imatches 'of=*'
     and not (ps.args imatches ('of=/dev/null', 'of=/tmp/*', 'of=/private/tmp/*', 'of=/private/var/folders/*', 'of=/var/tmp/*',
                                'of=/swapfile', 'of=/swap.img', 'of=/var/swap*', 'of=/var/vm/*', 'of=/private/var/vm/*')
              and not ps.args imatches 'of=*/../*'
              and not ps.cmdline regex '(^|\\s)of=.*\\sof='))
    or (not ps.args imatches 'if=*'
        and ps.args imatches ('of=/dev/disk*', 'of=/dev/rdisk*', 'of=/dev/sd*', 'of=/dev/nvme*', 'of=/dev/hd*', 'of=/dev/vd*', 'of=/dev/xvd*', 'of=/dev/mmcblk*'))
  )
output: "dd (pid %ps.pid, parent %ps.parent.exe) destroyed data: %ps.cmdline"
severity: high
action: []
tests:
  atomic: [38deee99-fd65-4031-bec8-bfa4f9f26146]
min-engine-version: 0.1.0
