# ZAAFVesper macros and lists for the macOS rule set.
#
# Order matters: a macro may only reference lists and macros defined above it.
# Paths: Endpoint Security reports resolved paths, so /tmp, /etc and /var arrive
# as /private/tmp, /private/etc and /private/var. Path lists carry both forms so
# that rules also work on captures from other sources.
# Globs: `*` matches any run of characters INCLUDING `/`.

# ---------------------------------------------------------------------------
# Lists
# ---------------------------------------------------------------------------

- list: shells
  items: ['/bin/sh', '/bin/bash', '/bin/zsh', '/bin/dash', '/bin/ksh', '/bin/tcsh', '/bin/csh',
          '/opt/homebrew/bin/bash', '/opt/homebrew/bin/zsh', '/opt/homebrew/bin/fish',
          '/usr/local/bin/bash', '/usr/local/bin/zsh', '/usr/local/bin/fish']

- list: shell_names
  items: ['sh', 'bash', 'zsh', 'dash', 'ksh', 'tcsh', 'csh', 'fish']

# Script interpreters by executable path (Apple-shipped and common Homebrew locations).
- list: script_interpreters
  items: ['/usr/bin/python3', '/usr/bin/perl', '/usr/bin/perl5.30', '/usr/bin/perl5.34', '/usr/bin/ruby',
          '/usr/bin/osascript', '/usr/bin/tclsh', '/usr/bin/php',
          '/opt/homebrew/bin/python3', '/opt/homebrew/bin/node', '/opt/homebrew/bin/ruby', '/opt/homebrew/bin/perl',
          '/usr/local/bin/python3', '/usr/local/bin/node', '/usr/local/bin/ruby', '/usr/local/bin/pwsh']

# Script interpreters by process name (glob, case-insensitive use with imatches).
- list: script_interpreter_name_globs
  items: ['python*', 'perl*', 'ruby*', 'node', 'php*', 'tclsh*', 'lua*', 'pwsh', 'osascript']

# Apple daemons trusted to touch launch items, keychains, logs and TCC state.
# Only meaningful together with ps.is_platform = true (see macro apple_trusted_process).
# com.apple.installd is deliberately absent: it installs third-party packages,
# malicious ones included. system_installd only installs Apple-signed packages.
- list: apple_signed_trusted
  items: ['com.apple.xpc.launchd', 'com.apple.backgroundtaskmanagementd',
          'com.apple.system_installd', 'com.apple.softwareupdated', 'com.apple.securityd',
          'com.apple.secd', 'com.apple.trustd', 'com.apple.tccd', 'com.apple.backupd',
          'com.apple.backupd-helper', 'com.apple.mds', 'com.apple.mdworker', 'com.apple.mdworker.shared',
          'com.apple.mds_stores', 'com.apple.newsyslog', 'com.apple.aslmanager', 'com.apple.syslogd',
          'com.apple.logd', 'com.apple.auditd', 'com.apple.syspolicyd', 'com.apple.lsd']

# Writable staging locations where a dropped payload commonly lands.
- list: temp_drop_globs
  items: ['/private/tmp/*', '/tmp/*', '/private/var/tmp/*', '/var/tmp/*', '/Users/Shared/*']

# Locations a user can write without admin rights, plus mounted images and
# App Translocation. Used to judge the origin of a parent/ancestor executable.
- list: user_writable_exe_globs
  items: ['/private/tmp/*', '/tmp/*', '/private/var/tmp/*', '/var/tmp/*', '/Users/Shared/*',
          '/Users/*/Downloads/*', '/Users/*/Desktop/*', '/Users/*/Library/*', '/Users/*/.*',
          '/private/var/folders/*', '/Volumes/*']

# Generic tools an attacker uses to read or copy a secret file.
- list: file_access_tool_names
  items: ['cat', 'cp', 'ditto', 'rsync', 'scp', 'sftp', 'tar', 'zip', 'gzip', 'bzip2', 'xz', 'dd',
          'base64', 'xxd', 'hexdump', 'od', 'strings', 'sqlite3', 'curl', 'nc', 'ncat', 'head', 'tail',
          'less', 'more', 'grep', 'egrep', 'fgrep', 'openssl', 'split', 'mv', 'ln']

# Browser vendor Team IDs (Developer ID). A wrong ID would allow-list some other
# developer, so only verified IDs are listed: Google EQHXZ8M8AV (checked with
# codesign on this Mac, 7 Nov 2026), Mozilla 43AQ936H96, Microsoft UBF8T346G9,
# Brave KL8N8XSYF4. Opera, Vivaldi and Arc are deliberately absent until their
# IDs are read from a real install (`codesign -dv <app>`); until then those
# browsers reading their own stores raise alerts.
- list: browser_team_ids
  items: ['EQHXZ8M8AV', '43AQ936H96', 'UBF8T346G9', 'KL8N8XSYF4']

# Code-signing validation categories (ps.cs_category, from Endpoint Security's
# cs_validation_category, macOS 15+) under which a Team ID is backed by an
# Apple-issued certificate: Developer ID and Mac App Store. A self-signed or
# locally signed binary that embeds another vendor's Team ID reports
# local_signing (or another category) and fails. Where Endpoint Security does
# not report a category the field is nil, the `in` test is false, and every
# Team ID trust built on it fails closed (more alerts, never fewer).
- list: vendor_cs_categories
  items: ['developer_id', 'app_store']

# Apple processes that legitimately read Safari/WebKit cookie and credential stores.
- list: apple_browser_signing_prefixes
  items: ['com.apple.Safari', 'com.apple.WebKit', 'com.apple.cfnetwork', 'com.apple.nsurlsessiond',
          'com.apple.CloudKit', 'com.apple.cloudd', 'com.apple.backupd', 'com.apple.mdworker', 'com.apple.mds']

# Security and monitoring products: launchd labels and plist fragments.
- list: security_tool_identifiers
  items: ['com.crowdstrike', 'at.obdev.littlesnitch', 'com.carbonblack', 'com.vmware.carbonblack',
          'com.opendns', 'com.cisco.umbrella', 'com.cisco.amp', 'com.sentinelone', 'com.microsoft.wdav',
          'com.microsoft.fresno', 'com.objective-see', 'com.jamf.protect', 'com.malwarebytes', 'com.sophos',
          'com.eset', 'com.paloaltonetworks', 'com.elastic', 'com.osquery', 'io.osquery', 'com.cylance',
          'com.trendmicro', 'com.bitdefender', 'com.kaspersky', 'com.google.santa', 'com.northpolesec.santa',
          'com.apple.XProtect', 'com.rifqifitriady.zaafvesper']

# Security and monitoring products: process names an attacker greps for or kills.
- list: security_tool_process_names
  items: ['falcond', 'falcon-sensor', 'com.crowdstrike', 'Little Snitch', 'LittleSnitch', 'CbOsxSensorService',
          'CbDefense', 'nessusd', 'santad', 'td-agent', 'packetbeat', 'filebeat', 'auditbeat', 'osqueryd',
          'BlockBlock', 'LuLu', 'KnockKnock', 'SentinelAgent', 'sentineld', 'wdavdaemon', 'JamfProtect',
          'SophosScanD', 'esets_daemon']

# Apple logging and audit daemons (system-logging impairment rule).
- list: logging_service_identifiers
  items: ['com.apple.auditd', 'com.apple.syslogd', 'com.apple.logd', 'com.apple.aslmanager', 'com.apple.diagnosticd']

# Logging and audit configuration files.
- list: logging_config_globs
  items: ['/private/etc/security/audit_control', '/etc/security/audit_control',
          '/private/etc/security/audit_event', '/etc/security/audit_event',
          '/private/etc/asl.conf', '/etc/asl.conf', '/private/etc/asl/*', '/etc/asl/*',
          '/private/etc/syslog.conf', '/etc/syslog.conf',
          '/private/etc/newsyslog.conf', '/etc/newsyslog.conf', '/private/etc/newsyslog.d/*', '/etc/newsyslog.d/*',
          '/Library/Preferences/Logging/*']

# ZAAFVesper's own moving parts: killing these blinds the sensor.
- list: sensor_self_names
  items: ['eslogger', 'zaafvesper']

# Shell start-up files (T1546.004).
- list: shell_profile_globs
  items: ['/Users/*/.bash_profile', '/Users/*/.bashrc', '/Users/*/.bash_login', '/Users/*/.profile',
          '/Users/*/.zshrc', '/Users/*/.zshenv', '/Users/*/.zprofile', '/Users/*/.zlogin', '/Users/*/.zlogout',
          '/Users/*/.config/fish/config.fish', '/private/var/root/.zshrc', '/private/var/root/.bash_profile',
          '/private/var/root/.profile', '/private/etc/profile', '/private/etc/zshrc', '/private/etc/zshenv',
          '/private/etc/zprofile', '/private/etc/bashrc', '/etc/profile', '/etc/zshrc', '/etc/zshenv',
          '/etc/zprofile', '/etc/bashrc']

# Shell history files (T1070.003).
- list: shell_history_names
  items: ['.bash_history', '.zsh_history', '.sh_history', '.history', '.ksh_history', '.fish_history']

# Apple system and audit logs (T1685.006). Scoped to logs Apple's own daemons
# write, so third-party agents rotating their own files in /var/log do not need an
# allow-list.
- list: system_log_globs
  items: ['/private/var/log/system.log*', '/var/log/system.log*', '/private/var/log/install.log*', '/var/log/install.log*',
          '/private/var/log/wifi.log*', '/private/var/log/fsck_*', '/private/var/log/asl/*', '/var/log/asl/*',
          '/private/var/log/DiagnosticMessages/*', '/private/var/log/com.apple.xpc.launchd/*',
          '/private/var/log/powermanagement/*', '/private/var/log/daily.out', '/private/var/log/weekly.out',
          '/private/var/log/monthly.out', '/private/var/audit/*', '/var/audit/*',
          '/private/var/db/diagnostics/*', '/var/db/diagnostics/*', '/private/var/db/uuidtext/*', '/var/db/uuidtext/*']

# Cron and periodic locations (T1053.003).
- list: cron_globs
  items: ['/private/var/at/tabs/*', '/usr/lib/cron/tabs/*', '/private/etc/crontab', '/etc/crontab',
          '/private/etc/cron.*', '/etc/cron.*', '/private/etc/periodic/*', '/etc/periodic/*',
          '/usr/local/etc/periodic/*', '/private/etc/periodic.conf', '/etc/periodic.conf']

# Sudoers (T1548.003).
- list: sudoers_globs
  items: ['/private/etc/sudoers', '/etc/sudoers', '/private/etc/sudoers.d/*', '/etc/sudoers.d/*']

# TCC databases (T1548.006).
- list: tcc_db_globs
  items: ['/Library/Application Support/com.apple.TCC/TCC.db*',
          '/Users/*/Library/Application Support/com.apple.TCC/TCC.db*']

# ---------------------------------------------------------------------------
# Event macros (one per canonical evt.name)
# ---------------------------------------------------------------------------

- macro: spawn_process
  expr: evt.name = 'CreateProcess'
- macro: fork_process
  expr: evt.name = 'Fork'
- macro: exit_process
  expr: evt.name = 'TerminateProcess'
- macro: open_file
  expr: evt.name = 'OpenFile'
- macro: create_file
  expr: evt.name = 'CreateFile'
- macro: write_file
  expr: evt.name = 'WriteFile'
- macro: rename_file
  expr: evt.name = 'RenameFile'
- macro: delete_file
  expr: evt.name = 'DeleteFile'
- macro: set_xattr
  expr: evt.name = 'SetXattr'
- macro: delete_xattr
  expr: evt.name = 'DeleteXattr'
- macro: set_mode
  expr: evt.name = 'SetMode'
- macro: set_owner
  expr: evt.name = 'SetOwner'
- macro: open_process
  expr: evt.name = 'OpenProcess'
- macro: send_signal
  expr: evt.name = 'Signal'
- macro: ptrace
  expr: evt.name = 'Ptrace'
- macro: remote_thread
  expr: evt.name = 'CreateRemoteThread'
- macro: add_launch_item
  expr: evt.name = 'AddLaunchItem'
- macro: load_kext
  expr: evt.name = 'LoadKext'
- macro: mount
  expr: evt.name = 'Mount'
- macro: authenticate
  expr: evt.name = 'Authenticate'
- macro: sudo
  expr: evt.name = 'Sudo'
- macro: modify_tcc
  expr: evt.name = 'ModifyTCC'
- macro: xprotect_detect
  expr: evt.name = 'XProtectDetect'
- macro: yara_match
  expr: evt.name = 'YaraMatch'
# Synthetic: ZAAFVesper's own telemetry is degraded (evt.arg[condition], evt.arg[detail]).
- macro: sensor_degraded
  expr: evt.name = 'SensorDegraded'

# ---------------------------------------------------------------------------
# Composite macros
# ---------------------------------------------------------------------------

# A file was created, written, or something was renamed onto it. Use with
# file.path for create/write and with file.dest for rename (see modify_path_* rules).
- macro: file_written
  expr: evt.name in ('CreateFile', 'WriteFile')

# Apple platform binary on the trusted-daemon list. ps.is_platform cannot be
# forged by an ad-hoc signature, so the signing_id check is safe to rely on here.
- macro: apple_trusted_process
  expr: ps.is_platform = true and ps.signing_id in apple_signed_trusted

# Apple Installer / PackageKit writing package payloads. PackageKit installs ANY
# .pkg, malicious ones included, so this is only safe for SIP-protected
# destinations that third-party packages cannot write (see StartupItems rule).
- macro: apple_package_installer
  expr: ps.is_platform = true and ps.exe istartswith '/System/Library/PrivateFrameworks/PackageKit.framework/'

# Signing semantics (decoder contract, pkg/source/eslogger/README.md): ps.is_signed
# is true only when CS_SIGNED and CS_VALID are set and CS_ADHOC is not. That does
# NOT mean the certificate chains to Apple: a self-signed certificate also gives
# is_signed = true, and may embed any Team ID it likes (open finding M4). Trust
# therefore never rests on is_signed, signing_id or team_id alone; it rests on
# ps.is_platform = true (Apple platform binary) or on a Team ID whose signing
# category is Developer ID or App Store (macro verified_team_id), usually paired
# with that vendor's signing IDs.
#
# Apple's own non-platform software (Xcode, Command Line Tools, debugserver,
# clang) is signed with Apple's Team ID 59GAB85EFG (checked with codesign on
# this Mac, 7 Nov 2026); it is NOT a platform binary.
#
# Unknown parent = untrusted (open finding M2). When the parent is not in the
# process table every ps.parent.* field is nil, and any comparison on it is
# false (infix negations included). Parent macros below are written so that an
# absent parent comes out UNTRUSTED: trust is tested positively and negated with
# a prefix `not`, never with `= false` or `!=`.

# A Team ID backed by an Apple-issued certificate (Developer ID or App Store).
# False when the category is unreported (nil): fails closed.
- macro: verified_team_id
  expr: (ps.team_id != '' and ps.cs_category in vendor_cs_categories)

- macro: parent_verified_team_id
  expr: (ps.parent.team_id != '' and ps.parent.cs_category in vendor_cs_categories)

# No verified developer identity: not a platform binary and no verified Team ID.
# Covers unsigned, ad-hoc, linker-signed and self-signed code, a self-signed
# certificate carrying a forged Team ID, and (fail closed) any Team ID when the
# signing category is not reported.
- macro: no_developer_identity
  expr: (ps.is_platform = false and not (verified_team_id))

# Same for the parent. An absent parent (not in the process table) is TRUE here:
# both prefix `not`s turn the nil comparisons into true.
- macro: parent_no_developer_identity
  expr: (not (ps.parent.is_platform = true) and not (parent_verified_team_id))

# Apple-signed, non-platform developer tools (Xcode / CLT), bound to Apple's Team
# ID with a verified signing category.
- macro: apple_developer_tool
  expr: (ps.is_platform = false and ps.team_id = '59GAB85EFG' and ps.cs_category in vendor_cs_categories and ps.signing_id istartswith 'com.apple.')

- macro: parent_apple_developer_tool
  expr: (ps.parent.is_platform = false and ps.parent.team_id = '59GAB85EFG' and ps.parent.cs_category in vendor_cs_categories and ps.parent.signing_id istartswith 'com.apple.')

# Executable lives somewhere a normal user can write, or on a mounted image.
- macro: parent_from_user_writable
  expr: ps.parent.exe imatches user_writable_exe_globs

- macro: ancestor_from_user_writable
  expr: ps.ancestors imatches user_writable_exe_globs

# The ancestor chain does not reach launchd: some ancestor is unknown (evicted
# from the process table, or exited and its pid reused), or the chain hit the
# 16-entry depth bound. pkg/ps never evicts launchd and stops the chain at the
# first unknown ancestor, so an unknown ancestor always removes /sbin/launchd.
# An empty or absent list is TRUE (prefix `not`).
- macro: ancestor_chain_incomplete
  expr: not (ps.ancestors = '/sbin/launchd')

# Generic file tools and script interpreters (by name) - the usual readers of a
# stolen secret when the stealer lives off the land.
- macro: generic_reader_process
  expr: (ps.name in file_access_tool_names or ps.name imatches script_interpreter_name_globs)

# osascript invocation.
- macro: spawn_osascript
  expr: spawn_process and ps.exe = '/usr/bin/osascript'

# Has a verified developer identity (Developer ID / App Store Team ID, not a
# platform binary) and is not a script interpreter. NOT a trust anchor: any
# Developer ID holder satisfies it. Used only to route such writers to a
# lower-severity companion rule, never to drop an event. A forged Team ID
# (self-signed, local_signing) or an unreported category does not satisfy it,
# so such writers stay on the high-severity rule.
- macro: developer_id_signed
  expr: ps.is_signed = true and ps.is_platform = false and verified_team_id and not (ps.name imatches script_interpreter_name_globs)

# AppleScript / JXA dialog that asks for a secret.
- macro: osascript_credential_prompt
  expr: >
    ps.cmdline icontains ('display dialog', 'displayDialog')
    and ps.cmdline icontains ('default answer', 'defaultAnswer')
    and ps.cmdline icontains ('hidden answer', 'hiddenAnswer', 'password', 'passphrase')

# Reparented to launchd: the process's parent is now launchd (pid 1) but it was
# forked by another process (es_process_t.original_ppid). A double fork hides the
# real origin behind launchd, so it counts as an unknown origin. An absent
# original_ppid (nil, not reported) is NOT reparented: `!=` on nil is false.
- macro: reparented
  expr: (ps.ppid = 1 and ps.original_ppid != 1)

# The parent is launchd itself (ppid 1, parent /sbin/launchd): a LaunchAgent or
# LaunchDaemon started the process directly, or a double fork reparented it
# (then `reparented` also holds when original_ppid is reported). A password
# prompt has no legitimate reason to come straight from a launch job, and a
# user-writable LaunchAgent plist is how a payload gets that parent, so the
# owner decided (8 Nov 2026, F3 residual) to treat it as an untrusted origin.
# The kill target is then launchd, which the response layer always refuses:
# alert-only.
- macro: launchd_parent
  expr: (ps.ppid = 1 and ps.parent.exe = '/sbin/launchd')

# The prompt comes from an untrusted origin: a parent without verified developer
# identity (unsigned, ad-hoc, self-signed, forged Team ID, unreported category),
# an UNKNOWN parent (not in the process table), a parent or ancestor running
# from a user-writable location or mounted image, or an ancestor chain that does
# not reach launchd (an ancestor is unknown), or a process reparented to launchd
# by a double fork, or a parent that is launchd itself (launchd_parent), or
# ps.ancestors_untrusted (computed by pkg/ps: some ancestor
# up to launchd is neither a platform binary nor a verified vendor identity, or
# the chain is incomplete). Path globs stay as extra signals. Unknown = untrusted, so flooding
# the process table to evict the payload cannot downgrade this to the
# high-severity companion rule.
- macro: untrusted_prompt_origin
  expr: (parent_no_developer_identity or parent_from_user_writable or ancestor_from_user_writable or ancestor_chain_incomplete or reparented or launchd_parent or ps.ancestors_untrusted = true)

# Text editors trusted to write shell start-up files: only vendor GUI editors
# with an identity an attacker cannot choose - that vendor's signing ID, Team ID
# and a verified signing category. VS Code = Microsoft UBF8T346G9; Sublime Text =
# Z6D26JE4Y4 (checked with codesign on this Mac). Other editors stay out until
# their Team ID is verified.
# Apple platform terminal editors (vi, vim, nano, pico, ed) are NOT trusted since
# round 3 (finding F4): a payload can drive vim through a pseudo-terminal
# (script(1)) with VIMINIT or keystrokes, so a TTY and clean argv prove nothing.
# Real edits of ~/.zshrc in vim or nano therefore alert (medium).
# Residual: VS Code's Electron binary can run as Node (ELECTRON_RUN_AS_NODE=1)
# under its genuine signature; not covered.
- macro: trusted_editor
  expr: >
    (verified_team_id and ps.team_id = 'UBF8T346G9' and ps.signing_id in ('com.microsoft.VSCode', 'com.microsoft.VSCodeInsiders'))
    or (verified_team_id and ps.team_id = 'Z6D26JE4Y4' and ps.signing_id in ('com.sublimetext.4', 'com.sublimetext.3'))

# Browser credential, cookie and key stores (T1555.003). Chromium-family profiles
# share a layout: <root>/<profile>/Login Data, Cookies (or Network/Cookies), Web Data.
- list: browser_secret_globs
  items: ['/Users/*/Library/Application Support/Google/Chrome/*/Login Data',
          '/Users/*/Library/Application Support/Google/Chrome/*/Login Data For Account',
          '/Users/*/Library/Application Support/Google/Chrome/*/Cookies',
          '/Users/*/Library/Application Support/Google/Chrome/*/Web Data',
          '/Users/*/Library/Application Support/Google/Chrome/Local State',
          '/Users/*/Library/Application Support/Chromium/*/Login Data',
          '/Users/*/Library/Application Support/Chromium/*/Cookies',
          '/Users/*/Library/Application Support/BraveSoftware/Brave-Browser/*/Login Data',
          '/Users/*/Library/Application Support/BraveSoftware/Brave-Browser/*/Cookies',
          '/Users/*/Library/Application Support/BraveSoftware/Brave-Browser/*/Web Data',
          '/Users/*/Library/Application Support/Microsoft Edge/*/Login Data',
          '/Users/*/Library/Application Support/Microsoft Edge/*/Cookies',
          '/Users/*/Library/Application Support/Microsoft Edge/*/Web Data',
          '/Users/*/Library/Application Support/com.operasoftware.Opera*/Login Data',
          '/Users/*/Library/Application Support/com.operasoftware.Opera*/Cookies',
          '/Users/*/Library/Application Support/Vivaldi/*/Login Data',
          '/Users/*/Library/Application Support/Vivaldi/*/Cookies',
          '/Users/*/Library/Application Support/Arc/User Data/*/Login Data',
          '/Users/*/Library/Application Support/Arc/User Data/*/Cookies',
          '/Users/*/Library/Application Support/Firefox/Profiles/*/logins.json',
          '/Users/*/Library/Application Support/Firefox/Profiles/*/key4.db',
          '/Users/*/Library/Application Support/Firefox/Profiles/*/cookies.sqlite',
          '/Users/*/Library/Cookies/Cookies.binarycookies',
          '/Users/*/Library/Containers/com.apple.Safari/Data/Library/Cookies/Cookies.binarycookies']

# ---------------------------------------------------------------------------
# Response companions (v0.2 active response)
# ---------------------------------------------------------------------------

# A quarantine attribute remover that is untrusted: the remover itself has no
# verified developer identity, or it is an Apple tool (xattr) whose direct
# parent has none (a dropper running `xattr -d`). Only the direct parent is
# judged, not ps.ancestors_untrusted: terminal apps started before the sensor
# are seeded without a Team ID, which would make every manual `xattr -d` from
# iTerm2 look untrusted. An unknown parent counts as untrusted.
- macro: untrusted_quarantine_remover
  expr: (no_developer_identity or (ps.is_platform = true and parent_no_developer_identity))

# A launch item plist writer that is untrusted (no platform identity and no
# verified Developer ID / App Store Team ID), except Homebrew's own service
# plists (homebrew.mxcl.*, written by Homebrew's Ruby for `brew services`),
# which stay alert-only on the plist rules. The exception is by file name, so
# malware that names its plist homebrew.mxcl.* still alerts but is not acted on.
- macro: untrusted_launch_item_writer
  expr: >
    (no_developer_identity
     and not (file.path imatches '*/homebrew.mxcl.*.plist' or file.dest imatches '*/homebrew.mxcl.*.plist'))
