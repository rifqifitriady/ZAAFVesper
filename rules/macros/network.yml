# Network macros (workstream W2). macOS network events come from socket
# polling (pkg/source/netpoll): net.dhost is never set and DNS is not
# visible, connections shorter than the poll interval are missed.

# A connection to or from another host (not a listening socket).
- macro: net_remote_connection
  expr: (evt.name in ('NetworkConnect', 'NetworkAccept') and net.direction in ('outbound', 'inbound'))

# Private, loopback, link-local, CGNAT (100.64.0.0/10) and unique-local destinations.
- list: net_private_prefixes
  items: ['10.', '127.', '169.254.', '192.168.', '0.',
          '172.16.', '172.17.', '172.18.', '172.19.', '172.20.', '172.21.', '172.22.', '172.23.',
          '172.24.', '172.25.', '172.26.', '172.27.', '172.28.', '172.29.', '172.30.', '172.31.',
          '100.64.', '100.65.', '100.66.', '100.67.', '100.68.', '100.69.', '100.70.', '100.71.', '100.72.', '100.73.', '100.74.', '100.75.', '100.76.', '100.77.', '100.78.', '100.79.', '100.80.', '100.81.', '100.82.', '100.83.', '100.84.', '100.85.', '100.86.', '100.87.', '100.88.', '100.89.', '100.90.', '100.91.', '100.92.', '100.93.', '100.94.', '100.95.', '100.96.', '100.97.', '100.98.', '100.99.', '100.100.', '100.101.', '100.102.', '100.103.', '100.104.', '100.105.', '100.106.', '100.107.', '100.108.', '100.109.', '100.110.', '100.111.', '100.112.', '100.113.', '100.114.', '100.115.', '100.116.', '100.117.', '100.118.', '100.119.', '100.120.', '100.121.', '100.122.', '100.123.', '100.124.', '100.125.', '100.126.', '100.127.',
          '::1', 'fe8', 'fe9', 'fea', 'feb', 'fc', 'fd']

- macro: net_dst_public
  expr: (net.dip != '' and not (net.dip istartswith net_private_prefixes))

# Ports most clients use legitimately (web, mail, DNS, NTP, SSH, Apple push,
# STUN/TURN). Anything else is "uncommon" for a script interpreter.
- list: net_common_ports
  items: [20, 21, 22, 25, 53, 80, 110, 123, 143, 443, 465, 587, 853, 993, 995, 3478, 5223, 5228, 8080, 8443]

# Per-user temp folders ($TMPDIR) in addition to the shared temp folders.
- list: net_temp_globs
  items: ['/private/tmp/*', '/tmp/*', '/private/var/tmp/*', '/var/tmp/*', '/Users/Shared/*',
          '/private/var/folders/*/T/*', '/var/folders/*/T/*']

# Identity read from the kernel by the poller rather than from an exec
# event in the process table: signing data is unknown.
- macro: net_identity_unverified
  expr: (evt.arg[identity] = 'unverified')
