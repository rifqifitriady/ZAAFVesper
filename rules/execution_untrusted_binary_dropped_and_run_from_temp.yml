name: Binary dropped in a temp or shared folder and executed without developer identity
id: 4c8d26ca-f48c-4da1-b3b4-e1648b057ecb
version: 1.1.0
description: |
  Sequence: a file is created in /tmp, /var/tmp or /Users/Shared and, within ten
  minutes, that same path is executed as a process without verified developer identity
  (not an Apple platform binary and no Team ID with a Developer ID or App Store signing
  category: unsigned, ad-hoc, self-signed or a forged Team ID). Second-stage payloads are commonly staged exactly like
  this (curl -o /tmp/x; chmod +x; /tmp/x). Developer ID signed installers and helpers
  that run from /tmp carry a verified Team ID and do not match.
  Note: shebang scripts execute as their interpreter (ps.exe is /bin/sh), so this rule
  covers Mach-O payloads only.
labels:
  tactic.id: TA0002
  tactic.name: Execution
  technique.id: T1204.002
  technique.name: Malicious File
references:
  - https://attack.mitre.org/techniques/T1204/002/
  - atomic b16ef901-00bb-4dda-b4fc-a04db5067e20 (indexed T1027.002) also exercises this behaviour (cp UPX binary to /tmp and run it)
  - atomic 4d46e16b-5765-4046-9f25-a600d3e65e4d (indexed T1027.002) also exercises this behaviour
condition: >
  sequence maxspan 10m
    |create_file and file.path imatches temp_drop_globs| by file.path
    |spawn_process and no_developer_identity and ps.exe imatches temp_drop_globs| by ps.exe
output: "%2.ps.exe (pid %2.ps.pid, signing %2.ps.signing_id) ran after being written by %1.ps.exe"
severity: high
action: []
tests:
  atomic: []
min-engine-version: 0.1.0
