name: Fake password prompt via osascript
id: 00160c57-4902-474b-9e78-10431e62654f
version: 1.3.0
description: |
  osascript displayed a dialog with a text-entry field that is hidden or asks for a
  password/passphrase (AppleScript `display dialog ... default answer "" with hidden
  answer`, JXA `displayDialog(..., {hiddenAnswer: true})`). Atomic Stealer, Cuckoo,
  Banshee and many fake installers phish the login password this way, then use it to
  unlock the keychain. Real system prompts come from SecurityAgent, never osascript.
  The case where the prompt comes from an untrusted origin (a parent without verified
  developer identity, an unknown parent, a binary on a mounted image or in a
  user-writable folder, an incomplete ancestor chain, a prompt reparented to launchd
  by a double fork, or an ancestor without trusted identity per ps.ancestors_untrusted) is handled by the companion rule
  "Fake password prompt via osascript from untrusted origin" (critical, kills the
  parent), so this rule excludes it to avoid duplicate alerts.
labels:
  tactic.id: TA0006
  tactic.name: Credential Access
  technique.id: T1056.002
  technique.name: GUI Input Capture
references:
  - https://attack.mitre.org/techniques/T1056/002/
condition: >
  spawn_osascript
  and osascript_credential_prompt
  and not (untrusted_prompt_origin)
output: "osascript (pid %ps.pid, parent %ps.parent.exe) showed a password prompt: %ps.cmdline"
severity: high
action: []
tests:
  atomic: [76628574-0bc1-4646-8fe2-8f4427b47d15, b7037b89-947a-427a-ba29-e7e9f09bc045]
min-engine-version: 0.1.0
