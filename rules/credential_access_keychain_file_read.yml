name: Keychain database read by file tool or untrusted binary
id: d5ac8697-f9e9-4433-86e7-fef8be1f2072
version: 1.1.0
description: |
  A keychain database (~/Library/Keychains/*, /Library/Keychains/System.keychain) or the
  System keychain master key (/private/var/db/SystemKey) was opened by a generic file
  tool (cat, cp, ditto, rsync, zip, sqlite3, ...) or by a binary without a developer
  identity (not a platform binary and no Team ID with a Developer ID or App Store signing
  category: unsigned, ad-hoc, self-signed, a forged Team ID, or any Team ID when the
  category is not reported). Stealers copy the encrypted database off the machine and crack or decrypt it
  later (chainbreaker). Apple's security daemons are excluded. Script interpreters are
  deliberately not in scope: Python/Ruby tools that use the keyring API open the file
  through Security.framework and would be noise.
labels:
  tactic.id: TA0006
  tactic.name: Credential Access
  technique.id: T1555.001
  technique.name: Keychain
references:
  - https://attack.mitre.org/techniques/T1555/001/
condition: >
  open_file
  and file.path imatches ('/Users/*/Library/Keychains/*', '/Library/Keychains/System.keychain', '/private/var/db/SystemKey', '/var/db/SystemKey')
  and (ps.name in file_access_tool_names or no_developer_identity)
  and not (apple_trusted_process)
output: "%ps.exe (pid %ps.pid, parent %ps.parent.cmdline) read keychain file %file.path"
severity: high
action: []
tests:
  atomic: [5c32102a-c508-49d3-978f-288f8a9f6617]
min-engine-version: 0.1.0
