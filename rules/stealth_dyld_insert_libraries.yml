name: Process started with DYLD_INSERT_LIBRARIES
id: aa125b5e-d64c-481b-80f1-958c01d52292
version: 1.0.0
description: |
  A process was executed with DYLD_INSERT_LIBRARIES in its environment, or env/launchctl
  was used to set it. dyld loads the listed dylibs into the new process before main(), a
  classic way to hijack an app that lacks the hardened runtime. Children that merely
  inherit the variable from a parent that already had it are suppressed, so one injection
  raises one alert. Xcode debugging tools (debugserver, Instruments) are excluded only when
  they carry Apple's Team ID 59GAB85EFG; they are not platform binaries.
  Requires the decoder to fill ps.env from eslogger exec events.
labels:
  tactic.id: TA0005
  tactic.name: Stealth
  technique.id: T1574.006
  technique.name: Dynamic Linker Hijacking
references:
  - https://attack.mitre.org/techniques/T1574/006/
condition: >
  spawn_process
  and (
    (ps.env[DYLD_INSERT_LIBRARIES] != '' and not (ps.parent.env[DYLD_INSERT_LIBRARIES] != ''))
    or (ps.exe = '/usr/bin/env' and ps.cmdline icontains 'DYLD_INSERT_LIBRARIES=')
    or (ps.exe = '/bin/launchctl' and ps.args = 'setenv' and ps.args = 'DYLD_INSERT_LIBRARIES')
  )
  and not (
    parent_apple_developer_tool
    and ps.parent.signing_id in ('com.apple.debugserver', 'com.apple.dt.Xcode', 'com.apple.dt.instruments', 'com.apple.dt.Instruments', 'com.apple.dt.xctest.tool')
  )
output: "%ps.exe (pid %ps.pid, parent %ps.parent.exe) started with DYLD_INSERT_LIBRARIES=%ps.env[DYLD_INSERT_LIBRARIES] %ps.cmdline"
severity: high
action: []
tests:
  atomic: [4d66029d-7355-43fd-93a4-b63ba92ea1be]
min-engine-version: 0.1.0
