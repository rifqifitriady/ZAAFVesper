name: Remote Login, Screen Sharing or Apple Remote Desktop enabled from the command line
id: 5e0d9c38-2a7f-4b14-a6e3-8c1f4d9b2e70
version: 1.0.0
platforms: [macos]
description: |
  The Apple Remote Desktop agent was activated with kickstart (-activate or -configure),
  Remote Login (SSH) was turned on with systemsetup -setremotelogin on, or launchctl
  loaded or enabled the sshd or Screen Sharing daemons. Attackers turn these on to come
  back over the network or to move to the Mac from another host. Turning them on in
  System Settings uses neither command and does not match.
labels:
  tactic.id: TA0008
  tactic.name: Lateral Movement
  technique.id: T1021.005, T1021.004
  technique.name: VNC; SSH
references:
  - https://attack.mitre.org/techniques/T1021/005/
  - https://attack.mitre.org/techniques/T1021/004/
condition: >
  spawn_process
  and (
    (ps.name = 'kickstart' and ps.exe icontains '/RemoteManagement/ARDAgent.app/'
     and ps.args in ('-activate', '-configure') and not ps.args in ('-deactivate', '-stop'))
    or (ps.name = 'systemsetup' and ps.args iin '-setremotelogin' and ps.args iin ('on', 'yes'))
    or (ps.name = 'launchctl' and ps.args in ('load', 'enable', 'bootstrap')
        and ps.cmdline icontains ('com.openssh.sshd', '/LaunchDaemons/ssh.plist', 'com.apple.screensharing'))
  )
output: "%ps.exe (pid %ps.pid, parent %ps.parent.exe) enabled remote access: %ps.cmdline"
severity: medium
action: []
tests:
  atomic: [8a930abe-841c-4d4f-a877-72e9fe90b9ea]
min-engine-version: 0.1.0
