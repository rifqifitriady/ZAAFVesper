match:
  - desc: "sudo cat /etc/shadow (ART T1003.008 #1)"
    events:
      - {"name": "CreateProcess", "platform": "linux", "proc": {"pid": 24601, "ppid": 24000, "exe": "/usr/bin/cat", "name": "cat", "uid": -1, "euid": -1, "username": "root", "cmdline": "cat /etc/shadow", "args": ["cat", "/etc/shadow"], "parent": {"pid": 24000, "exe": "/usr/bin/sudo", "name": "sudo"}}}
  - desc: "ed opens /etc/shadow by path"
    events:
      - {"name": "CreateProcess", "platform": "linux", "proc": {"pid": 24602, "ppid": 24000, "exe": "/usr/bin/ed", "name": "ed", "uid": -1, "euid": -1, "username": "root", "cmdline": "ed /etc/shadow", "args": ["ed", "/etc/shadow"], "parent": {"pid": 24000, "exe": "/usr/bin/sh", "name": "sh"}}}
  - desc: "unshadow prepares hashes for john"
    events:
      - {"name": "CreateProcess", "platform": "linux", "proc": {"pid": 24603, "ppid": 24000, "exe": "/usr/sbin/unshadow", "name": "unshadow", "uid": -1, "euid": -1, "username": "root", "cmdline": "unshadow /etc/passwd /etc/shadow", "args": ["unshadow", "/etc/passwd", "/etc/shadow"], "parent": {"pid": 24000, "exe": "/usr/bin/bash", "name": "bash"}}}
  - desc: "awk resolved to mawk, doubled slash"
    events:
      - {"name": "CreateProcess", "platform": "linux", "proc": {"pid": 24604, "ppid": 24000, "exe": "/usr/bin/mawk", "name": "mawk", "uid": -1, "euid": -1, "username": "root", "cmdline": "awk -F: {print} /etc//shadow", "args": ["awk", "-F:", "{print}", "/etc//shadow"], "parent": {"pid": 24000, "exe": "/usr/bin/sh", "name": "sh"}}}
  - desc: "busybox cat on Alpine"
    events:
      - {"name": "CreateProcess", "platform": "linux", "proc": {"pid": 24605, "ppid": 24000, "exe": "/bin/busybox", "name": "busybox", "uid": -1, "euid": -1, "username": "root", "cmdline": "cat /etc/shadow", "args": ["cat", "/etc/shadow"], "parent": {"pid": 24000, "exe": "/bin/sh", "name": "sh"}}}
  - desc: "cp of /etc/shadow to /tmp from /var/backups is not the backup"
    events:
      - {"name": "CreateProcess", "platform": "linux", "proc": {"pid": 24606, "ppid": 24000, "exe": "/usr/bin/cp", "name": "cp", "uid": -1, "euid": -1, "username": "root", "cmdline": "cp /etc/shadow /tmp/s", "args": ["cp", "/etc/shadow", "/tmp/s"], "parent": {"pid": 24000, "exe": "/usr/bin/sh", "name": "sh"}, "cwd": "/var/backups"}}
nomatch:
  - desc: "benign lookalike - passwd changes a password"
    events:
      - {"name": "CreateProcess", "platform": "linux", "proc": {"pid": 24611, "ppid": 24000, "exe": "/usr/bin/passwd", "name": "passwd", "uid": -1, "euid": -1, "username": "root", "cmdline": "passwd alice", "args": ["passwd", "alice"], "parent": {"pid": 24000, "exe": "/usr/bin/bash", "name": "bash"}}}
  - desc: "cat /etc/passwd (no hashes there)"
    events:
      - {"name": "CreateProcess", "platform": "linux", "proc": {"pid": 24612, "ppid": 24000, "exe": "/usr/bin/cat", "name": "cat", "uid": -1, "euid": -1, "username": "alice", "cmdline": "cat /etc/passwd", "args": ["cat", "/etc/passwd"], "parent": {"pid": 24000, "exe": "/usr/bin/bash", "name": "bash"}}}
  - desc: "grep searches a backup script that mentions shadow"
    events:
      - {"name": "CreateProcess", "platform": "linux", "proc": {"pid": 24613, "ppid": 24000, "exe": "/usr/bin/grep", "name": "grep", "uid": -1, "euid": -1, "username": "alice", "cmdline": "grep -r shadow /opt/backup/scripts", "args": ["grep", "-r", "shadow", "/opt/backup/scripts"], "parent": {"pid": 24000, "exe": "/usr/bin/bash", "name": "bash"}}}
  - desc: "cat of /etc/shadow.d-like name that is not the hash file"
    events:
      - {"name": "CreateProcess", "platform": "linux", "proc": {"pid": 24614, "ppid": 24000, "exe": "/usr/bin/cat", "name": "cat", "uid": -1, "euid": -1, "username": "alice", "cmdline": "cat /etc/shadow-utils.conf", "args": ["cat", "/etc/shadow-utils.conf"], "parent": {"pid": 24000, "exe": "/usr/bin/bash", "name": "bash"}}}
  - desc: "benign lookalike - Debian cron.daily passwd backup in /var/backups"
    events:
      - {"name": "CreateProcess", "platform": "linux", "proc": {"pid": 24615, "ppid": 24000, "exe": "/usr/bin/cp", "name": "cp", "uid": -1, "euid": -1, "username": "root", "cmdline": "cp -p /etc/shadow shadow.bak", "args": ["cp", "-p", "/etc/shadow", "shadow.bak"], "parent": {"pid": 24000, "exe": "/usr/bin/sh", "name": "sh"}, "cwd": "/var/backups"}}
