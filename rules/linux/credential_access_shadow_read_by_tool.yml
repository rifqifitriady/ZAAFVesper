name: /etc/shadow read with a file or text tool
id: 2b9f6e48-7c1d-4a35-8e06-d4a7b3c5f912
version: 1.0.0
platforms: [linux]
description: |
  A file viewer, text tool, encoder or password cracker (cat, head, tail, less, strings,
  grep, awk, sed, base64, xxd, ed, unshadow, john, ...) was given /etc/shadow or
  /etc/gshadow on its command line. Password hashes are read this way to crack them
  offline. Account tools (passwd, useradd, chpasswd) read the file without naming it
  and do not match. Doubled slashes (/etc//shadow) and a bare "shadow" run from /etc
  match; the image list includes the resolved forms (mawk, busybox, coreutils). Not
  covered: a shell builtin reading the file with redirection, other relative paths, or a
  tool that reads the path from standard input (the ART "standard binary" test feeds
  /etc/shadow to ed on stdin, so it is not linked). Debian's daily passwd backup
  (cp -p /etc/shadow shadow.bak in /var/backups) is excluded.
labels:
  tactic.id: TA0006
  tactic.name: Credential Access
  technique.id: T1003.008
  technique.name: /etc/passwd and /etc/shadow
references:
  - https://attack.mitre.org/techniques/T1003/008/
condition: >
  spawn_process
  and (ps.cmdline regex '/etc/+g?shadow(\\s|$|[^a-z.-])' or (ps.cwd = '/etc' and ps.args in ('shadow', 'gshadow')))
  and base(ps.exe) in ('cat', 'tac', 'head', 'tail', 'less', 'more', 'strings', 'grep', 'egrep', 'awk', 'gawk',
                       'mawk', 'nawk', 'sed', 'cut', 'base64', 'xxd', 'od', 'hexdump', 'ed', 'cp', 'dd', 'tee',
                       'busybox', 'coreutils', 'python', 'python3', 'perl', 'unshadow', 'john', 'hashcat')
  and not (base(ps.exe) = 'cp' and ps.cwd = '/var/backups' and ps.args in ('shadow.bak', 'gshadow.bak'))
output: "%ps.exe (pid %ps.pid, parent %ps.parent.exe, user %ps.username) read password hashes: %ps.cmdline"
severity: high
action: []
tests:
  atomic: [3723ab77-c546-403c-8fb4-bb577033b235]
min-engine-version: 0.1.0
