condition: evt.name in ('PipeConnect', 'PipeCreate') and ((evt.arg[pipe_name] icontains '\\MSSE-' and evt.arg[pipe_name] icontains '-server') or evt.arg[pipe_name] istartswith '\\postex_' or evt.arg[pipe_name] istartswith '\\status_' or evt.arg[pipe_name] istartswith '\\msagent_' or evt.arg[pipe_name] istartswith '\\mojo_' or evt.arg[pipe_name] istartswith '\\interprocess_' or evt.arg[pipe_name] istartswith '\\samr_' or evt.arg[pipe_name] istartswith '\\netlogon_' or evt.arg[pipe_name] istartswith '\\srvsvc_' or evt.arg[pipe_name] istartswith '\\lsarpc_' or evt.arg[pipe_name] istartswith '\\wkssvc_')
output: '%ps.exe (pid %ps.pid) matched on %evt.name (Sigma rule by Florian Roth (Nextron Systems), Wojciech Lesicki)'
severity: critical
action: []
min-engine-version: 0.1.0
