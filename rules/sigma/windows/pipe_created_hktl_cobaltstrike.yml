platforms: [windows]
description: |-
  Detects the creation of a named pipe as used by CobaltStrike

  Converted from Sigma rule d5601f8c-b26f-4ab0-9035-69e11a8d4ad2 by zaafvesper sigma convert. Sigma author: Florian Roth (Nextron Systems), Wojciech Lesicki.
