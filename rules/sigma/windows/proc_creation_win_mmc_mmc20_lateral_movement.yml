  Converted from Sigma rule f1f3bf22-deb2-418d-8cce-e1a45e46a5bd by zaafvesper sigma convert. Sigma author: @2xxeformyshirt (Security Risk Advisors) - rule; Teymur Kheirkhabarov (idea).
