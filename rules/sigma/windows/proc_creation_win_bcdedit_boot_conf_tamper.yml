version: 1.0.0
platforms: [windows]
description: |-
  Detects the use of the bcdedit command to tamper with the boot configuration data. This technique is often times used by malware or attackers as a destructive way before launching ransomware.

  Converted from Sigma rule 1444443e-6757-43e4-9ea4-c8fc705f79a2 by zaafvesper sigma convert. Sigma author: E.M. Anhaus (originally from Atomic Blue Detections, Endgame), oscd.community.
