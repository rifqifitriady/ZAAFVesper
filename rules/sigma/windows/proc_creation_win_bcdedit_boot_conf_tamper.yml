references:
  - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1490/T1490.md
  - https://eqllib.readthedocs.io/en/latest/analytics/c4732632-9c1d-4980-9fa8-1d98c93f918e.html
condition: evt.name in ('CreateProcess') and ((ps.exe iendswith '\\bcdedit.exe' or ps.original_name iin ('bcdedit.exe')) and ps.cmdline icontains 'set' and ((ps.cmdline icontains 'bootstatuspolicy' and ps.cmdline icontains 'ignoreallfailures') or (ps.cmdline icontains 'recoveryenabled' and ps.cmdline icontains 'no')))
output: '%ps.exe (pid %ps.pid, parent %ps.parent.exe) ran: %ps.cmdline (Sigma rule by E.M. Anhaus (originally from Atomic Blue Detections, Endgame), oscd.community)'
