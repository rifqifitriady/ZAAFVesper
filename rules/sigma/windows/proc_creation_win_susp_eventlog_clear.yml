condition: evt.name in ('CreateProcess') and (((((ps.exe iendswith '\\wevtutil.exe' or ps.original_name iin ('wevtutil.exe')) and ps.cmdline icontains ('clear-log ', ' cl ', 'set-log ', ' sl ', 'lfn:')) or (ps.exe iendswith ('\\powershell.exe', '\\powershell_ise.exe', '\\pwsh.exe') and (ps.cmdline icontains ('Clear-EventLog ', 'Remove-EventLog ', 'Limit-EventLog ', 'Clear-WinEvent ') or (ps.cmdline icontains 'Eventing.Reader.EventLogSession' and ps.cmdline icontains 'ClearLog') or (ps.cmdline icontains 'Diagnostics.EventLog' and ps.cmdline icontains 'Clear')))) or (ps.exe iendswith ('\\powershell.exe', '\\powershell_ise.exe', '\\pwsh.exe', '\\wmic.exe') and ps.cmdline icontains 'ClearEventLog')) and not (ps.parent.exe iin ('C:\\Windows\\SysWOW64\\msiexec.exe', 'C:\\Windows\\System32\\msiexec.exe') and ps.cmdline icontains ' sl '))
output: '%ps.exe (pid %ps.pid, parent %ps.parent.exe) ran: %ps.cmdline (Sigma rule by Ecco, Daniil Yugoslavskiy, oscd.community, D3F7A5105, Swachchhanda Shrawan Poudel (Nextron Systems))'
severity: high
