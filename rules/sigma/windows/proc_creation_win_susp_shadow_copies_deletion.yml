condition: evt.name in ('CreateProcess') and ((((ps.exe iendswith ('\\powershell.exe', '\\pwsh.exe', '\\wmic.exe', '\\vssadmin.exe', '\\diskshadow.exe') or ps.original_name iin ('PowerShell.EXE', 'pwsh.dll', 'wmic.exe', 'VSSADMIN.EXE', 'diskshadow.exe')) and (ps.cmdline icontains 'shadow' and ps.cmdline icontains 'delete')) or ((ps.exe iendswith '\\wbadmin.exe' or ps.original_name iin ('WBADMIN.EXE')) and (ps.cmdline icontains 'delete' and ps.cmdline icontains 'catalog' and ps.cmdline icontains 'quiet'))) or ((ps.exe iendswith '\\vssadmin.exe' or ps.original_name iin ('VSSADMIN.EXE')) and ((ps.cmdline icontains 'resize' and ps.cmdline icontains 'shadowstorage') and ps.cmdline icontains ('unbounded', '/MaxSize='))))
