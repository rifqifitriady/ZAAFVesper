# Hand-written fixtures (the converter does not generate them); values are invented.
match:
  - desc: "mscfile handler pointed at a payload (Event Viewer UAC bypass)"
    events:
      - {"name": "RegistrySetValue", "platform": "windows", "proc": {"pid": 6228, "ppid": 4000, "exe": "C:\\Windows\\System32\\reg.exe", "name": "reg.exe", "uid": -1, "euid": -1, "username": "CORP\\alice", "parent": {"pid": 4000, "exe": "C:\\Windows\\System32\\cmd.exe", "name": "cmd.exe"}}, "registry": {"key": "HKU\\S-1-5-21-1-2-3-1001_Classes\\mscfile\\shell\\open\\command\\(Default)", "value": "(Default)", "data": "C:\\Users\\alice\\AppData\\Local\\Temp\\p.exe"}}
nomatch:
  - desc: "benign lookalike - the default mmc handler restored"
    events:
      - {"name": "RegistrySetValue", "platform": "windows", "proc": {"pid": 6240, "ppid": 4000, "exe": "C:\\Windows\\System32\\reg.exe", "name": "reg.exe", "uid": -1, "euid": -1, "username": "CORP\\alice", "parent": {"pid": 4000, "exe": "C:\\Windows\\System32\\cmd.exe", "name": "cmd.exe"}}, "registry": {"key": "HKU\\S-1-5-21-1-2-3-1001_Classes\\mscfile\\shell\\open\\command\\(Default)", "value": "(Default)", "data": "%SystemRoot%\\system32\\mmc.exe \"%1\" %*"}}
  - desc: "another file type's open command"
    events:
      - {"name": "RegistrySetValue", "platform": "windows", "proc": {"pid": 6241, "ppid": 4000, "exe": "C:\\Program Files\\Editor\\editor.exe", "name": "editor.exe", "uid": -1, "euid": -1, "username": "CORP\\alice", "parent": {"pid": 4000, "exe": "C:\\Windows\\System32\\cmd.exe", "name": "cmd.exe"}}, "registry": {"key": "HKU\\S-1-5-21-1-2-3-1001_Classes\\txtfile\\shell\\open\\command\\(Default)", "value": "(Default)", "data": "C:\\Program Files\\Editor\\editor.exe \"%1\""}}
