    events:
      - {"name": "CreateProcess", "platform": "windows", "proc": {"pid": 8051, "ppid": 4000, "exe": "C:\\Windows\\System32\\VaultCmd.exe", "name": "VaultCmd.exe", "uid": -1, "euid": -1, "username": "CORP\\alice", "cmdline": "VaultCmd.exe /list", "args": ["VaultCmd.exe", "/list"], "original_name": "VAULTCMD.EXE", "parent": {"pid": 4000, "exe": "C:\\Windows\\System32\\cmd.exe", "name": "cmd.exe"}}}
