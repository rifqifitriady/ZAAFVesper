# Hand-written fixtures (the converter does not generate them); values are invented.
match:
  - desc: "cmstp spawns a child from a malicious INF"
    events:
      - {"name": "CreateProcess", "platform": "windows", "proc": {"pid": 8241, "ppid": 4000, "exe": "C:\\Windows\\System32\\cmd.exe", "name": "cmd.exe", "uid": -1, "euid": -1, "username": "CORP\\alice", "cmdline": "cmd.exe /c calc.exe", "args": ["cmd.exe", "/c", "calc.exe"], "original_name": "Cmd.Exe", "parent": {"pid": 4000, "exe": "C:\\Windows\\System32\\cmstp.exe", "name": "cmstp.exe"}}}
nomatch:
