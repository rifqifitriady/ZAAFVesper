      - {"name": "CreateProcess", "platform": "windows", "proc": {"pid": 6240, "ppid": 4000, "exe": "C:\\Windows\\System32\\certutil.exe", "name": "certutil.exe", "uid": -1, "euid": -1, "username": "CORP\\alice", "cmdline": "certutil.exe -urlcache -f https://pki.example/root.crl root.crl", "original_name": "CertUtil.exe", "parent": {"pid": 4000, "exe": "C:\\Windows\\System32\\cmd.exe", "name": "cmd.exe"}}}
