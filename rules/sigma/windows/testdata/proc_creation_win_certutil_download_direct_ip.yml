      - {"name": "CreateProcess", "platform": "windows", "proc": {"pid": 6241, "ppid": 4000, "exe": "C:\\Windows\\System32\\certutil.exe", "name": "certutil.exe", "uid": -1, "euid": -1, "username": "CORP\\alice", "cmdline": "certutil.exe -hashfile C:\\setup.exe SHA256", "original_name": "CertUtil.exe", "parent": {"pid": 4000, "exe": "C:\\Windows\\System32\\cmd.exe", "name": "cmd.exe"}}}
