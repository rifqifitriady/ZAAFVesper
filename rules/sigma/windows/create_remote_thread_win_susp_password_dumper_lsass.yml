  tactic.name: Credential Access
  technique.id: T1003.001
references:
  - https://jpcertcc.github.io/ToolAnalysisResultSheet/details/WCE.htm
condition: evt.name in ('CreateRemoteThread') and (target.ps.exe iendswith '\\lsass.exe' and evt.arg[start_module] iin (''))
output: '%ps.exe (pid %ps.pid) matched on %evt.name (Sigma rule by Thomas Patzke)'
