references:
  - https://www.acunetix.com/blog/articles/web-shells-101-using-php-introduction-web-shells-part-2/
  - https://media.defense.gov/2020/Jun/09/2002313081/-1/-1/0/CSI-DETECT-AND-PREVENT-WEB-SHELL-MALWARE-20200422.PDF
condition: evt.name in ('CreateProcess') and (((ps.parent.exe iendswith ('/httpd', '/lighttpd', '/nginx', '/apache2', '/node', '/caddy') or (ps.parent.cmdline icontains '/bin/java' and ps.parent.cmdline icontains 'tomcat') or (ps.parent.cmdline icontains '/bin/java' and ps.parent.cmdline icontains 'websphere')) and ps.exe iendswith ('/whoami', '/ifconfig', '/ip', '/bin/uname', '/bin/cat', '/bin/crontab', '/hostname', '/iptables', '/netstat', '/pwd', '/route')) and not (ps.parent.exe iendswith '/node' and ps.cmdline icontains 'ip neigh show'))
output: '%ps.exe (pid %ps.pid, parent %ps.parent.exe) ran: %ps.cmdline (Sigma rule by Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems))'
severity: high
action: []
min-engine-version: 0.1.0
notes: 'Sigma false positives: Web applications that invoke Linux command line tools'
