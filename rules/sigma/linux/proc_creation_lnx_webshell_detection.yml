description: |-
  Detects suspicious sub processes of web server processes

  Converted from Sigma rule 818f7b24-0fba-4c49-a073-8b755573b9c7 by zaafvesper sigma convert. Sigma author: Florian Roth (Nextron Systems), Nasreddine Bencherchali (Nextron Systems).
