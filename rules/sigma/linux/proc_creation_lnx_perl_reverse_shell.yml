condition: evt.name in ('CreateProcess') and ((ps.exe iendswith '/perl' and ps.cmdline icontains ' -e ') and ((ps.cmdline icontains 'fdopen(' and ps.cmdline icontains '::Socket::INET') or (ps.cmdline icontains 'Socket' and ps.cmdline icontains 'connect' and ps.cmdline icontains 'open' and ps.cmdline icontains 'exec')))
output: '%ps.exe (pid %ps.pid, parent %ps.parent.exe) ran: %ps.cmdline (Sigma rule by @d4ns4n_, Nasreddine Bencherchali (Nextron Systems))'
