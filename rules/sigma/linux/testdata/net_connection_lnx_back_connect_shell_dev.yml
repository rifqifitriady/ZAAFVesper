# Hand-written fixtures (the converter does not generate them); values are invented.
match:
  - desc: "bash connects out (bash -i >& /dev/tcp/...)"
    events:
      - {"name": "NetworkConnect", "platform": "linux", "proc": {"pid": 24101, "ppid": 24090, "exe": "/usr/bin/bash", "name": "bash", "uid": -1, "euid": -1, "username": "www-data", "parent": {"pid": 24090, "exe": "/usr/bin/bash", "name": "bash"}}, "net": {"proto": "tcp", "direction": "outbound", "sip": "10.0.0.20", "sport": 40112, "dip": "198.51.100.20", "dport": 4444}}
nomatch:
  - desc: "benign lookalike - bash checks a local port"
    events:
      - {"name": "NetworkConnect", "platform": "linux", "proc": {"pid": 24110, "ppid": 24090, "exe": "/usr/bin/bash", "name": "bash", "uid": -1, "euid": -1, "username": "root", "parent": {"pid": 24090, "exe": "/usr/bin/bash", "name": "bash"}}, "net": {"proto": "tcp", "direction": "outbound", "sip": "127.0.0.1", "sport": 40113, "dip": "127.0.0.1", "dport": 5432}}
  - desc: "curl to a remote server"
    events:
      - {"name": "NetworkConnect", "platform": "linux", "proc": {"pid": 24111, "ppid": 24090, "exe": "/usr/bin/curl", "name": "curl", "uid": -1, "euid": -1, "username": "www-data", "parent": {"pid": 24090, "exe": "/usr/bin/bash", "name": "bash"}}, "net": {"proto": "tcp", "direction": "outbound", "sip": "10.0.0.20", "sport": 40114, "dip": "198.51.100.30", "dport": 443}}
