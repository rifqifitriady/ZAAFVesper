condition: 'evt.name in (''CreateProcess'') and ((ps.cmdline icontains ''/var/log/syslog'' and ((ps.exe iendswith ''/rm'' and ps.cmdline icontains ('' -r '', '' -f '', '' -rf '', ''/var/log/syslog'')) or ps.exe iendswith ''/unlink'' or ps.exe iendswith ''/mv'' or (ps.exe iendswith ''/truncate'' and (ps.cmdline icontains ''0 '' and ps.cmdline icontains ''/var/log/syslog'') and ps.cmdline icontains (''-s '', ''-c '', ''--size'')) or (ps.exe iendswith ''/ln'' and (ps.cmdline icontains ''/dev/null '' and ps.cmdline icontains ''/var/log/syslog'') and ps.cmdline icontains (''-sf '', ''-sfn '', ''-sfT '')) or (ps.exe iendswith ''/cp'' and ps.cmdline icontains ''/dev/null'') or (ps.exe iendswith ''/shred'' and ps.cmdline icontains ''-u ''))) or (ps.cmdline icontains ('' > /var/log/syslog'', '' >/var/log/syslog'', '' >| /var/log/syslog'', '': > /var/log/syslog'', '':> /var/log/syslog'', '':>/var/log/syslog'', ''>|/var/log/syslog'') or ps.cmdline icontains (''journalctl --vacuum'', ''journalctl --rotate'')))'
output: '%ps.exe (pid %ps.pid, parent %ps.parent.exe) ran: %ps.cmdline (Sigma rule by Max Altgelt (Nextron Systems), Roberto Rodriguez (Cyb3rWard0g), OTR (Open Threat Research), MSTIC)'
