  - https://www.virustotal.com/gui/file/483fafc64a2b84197e1ef6a3f51e443f84dc5742602e08b9e8ec6ad690b34ed0/behavior
condition: evt.name in ('CreateProcess') and (ps.exe iendswith '/bash' and (ps.cmdline icontains 'tail' and ps.cmdline icontains '-c') and (ps.cmdline icontains 'base64' and ps.cmdline icontains '-d' and ps.cmdline icontains '>') and ps.cmdline icontains ('.avif', '.gif', '.jfif', '.jpeg', '.jpg', '.pjp', '.pjpeg', '.png', '.svg', '.webp'))
