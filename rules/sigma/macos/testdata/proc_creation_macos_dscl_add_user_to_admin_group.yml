match:
  - desc: "dscl appends a user to the admin group"
    events:
      - {"name": "CreateProcess", "platform": "macos", "proc": {"pid": 4401, "ppid": 4000, "exe": "/usr/bin/dscl", "name": "dscl", "args": ["dscl", ".", "-append", "/Groups/admin", "GroupMembership", "eviluser"], "uid": 0, "euid": 0, "is_platform": true, "is_signed": true, "signing_id": "com.apple.dscl", "parent": {"pid": 4000, "exe": "/bin/zsh", "name": "zsh"}}}
nomatch:
  - desc: "benign lookalike - dscl reads the admin group"
    events:
      - {"name": "CreateProcess", "platform": "macos", "proc": {"pid": 4411, "ppid": 4000, "exe": "/usr/bin/dscl", "name": "dscl", "args": ["dscl", ".", "-read", "/Groups/admin", "GroupMembership"], "uid": 501, "euid": 501, "is_platform": true, "is_signed": true, "signing_id": "com.apple.dscl", "parent": {"pid": 4000, "exe": "/bin/zsh", "name": "zsh"}}}
  - desc: "dscl appends to the staff group"
    events:
      - {"name": "CreateProcess", "platform": "macos", "proc": {"pid": 4412, "ppid": 4000, "exe": "/usr/bin/dscl", "name": "dscl", "args": ["dscl", ".", "-append", "/Groups/staff", "GroupMembership", "bob"], "uid": 0, "euid": 0, "is_platform": true, "is_signed": true, "signing_id": "com.apple.dscl", "parent": {"pid": 4000, "exe": "/bin/zsh", "name": "zsh"}}}
