match:
  - desc: "tmutil disable turns Time Machine off"
    events:
      - {"name": "CreateProcess", "platform": "macos", "proc": {"pid": 4301, "ppid": 4000, "exe": "/usr/bin/tmutil", "name": "tmutil", "args": ["tmutil", "disable"], "uid": 0, "euid": 0, "is_platform": true, "is_signed": true, "signing_id": "com.apple.tmutil", "parent": {"pid": 4000, "exe": "/bin/zsh", "name": "zsh"}}}
nomatch:
  - desc: "benign lookalike - tmutil enable"
    events:
      - {"name": "CreateProcess", "platform": "macos", "proc": {"pid": 4311, "ppid": 4000, "exe": "/usr/bin/tmutil", "name": "tmutil", "args": ["tmutil", "enable"], "uid": 0, "euid": 0, "is_platform": true, "is_signed": true, "signing_id": "com.apple.tmutil", "parent": {"pid": 4000, "exe": "/bin/zsh", "name": "zsh"}}}
  - desc: "benign lookalike - tmutil startbackup"
    events:
      - {"name": "CreateProcess", "platform": "macos", "proc": {"pid": 4312, "ppid": 4000, "exe": "/usr/bin/tmutil", "name": "tmutil", "args": ["tmutil", "startbackup", "--auto"], "uid": 501, "euid": 501, "is_platform": true, "is_signed": true, "signing_id": "com.apple.tmutil", "parent": {"pid": 4000, "exe": "/bin/zsh", "name": "zsh"}}}
