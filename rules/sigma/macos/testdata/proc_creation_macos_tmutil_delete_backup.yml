match:
  - desc: "tmutil delete removes a Time Machine backup"
    events:
      - {"name": "CreateProcess", "platform": "macos", "proc": {"pid": 4201, "ppid": 4000, "exe": "/usr/bin/tmutil", "name": "tmutil", "args": ["tmutil", "delete", "/Volumes/Backup/Backups.backupdb/mac/2026-11-01-101010"], "uid": 0, "euid": 0, "is_platform": true, "is_signed": true, "signing_id": "com.apple.tmutil", "parent": {"pid": 4000, "exe": "/bin/zsh", "name": "zsh"}}}
nomatch:
  - desc: "benign lookalike - tmutil listbackups"
    events:
      - {"name": "CreateProcess", "platform": "macos", "proc": {"pid": 4211, "ppid": 4000, "exe": "/usr/bin/tmutil", "name": "tmutil", "args": ["tmutil", "listbackups"], "uid": 501, "euid": 501, "is_platform": true, "is_signed": true, "signing_id": "com.apple.tmutil", "parent": {"pid": 4000, "exe": "/bin/zsh", "name": "zsh"}}}
  - desc: "rm deleting an unrelated file"
    events:
      - {"name": "CreateProcess", "platform": "macos", "proc": {"pid": 4212, "ppid": 4000, "exe": "/bin/rm", "name": "rm", "args": ["rm", "/tmp/delete-me.txt"], "uid": 501, "euid": 501, "is_platform": true, "is_signed": true, "signing_id": "com.apple.rm", "parent": {"pid": 4000, "exe": "/bin/zsh", "name": "zsh"}}}
