name: Files encrypted with openssl, gpg or 7z from the command line
id: 7a1c5e93-0d4b-4e62-9f18-3b6e2d8c4a75
version: 1.0.0
platforms: [macos, linux]
description: |
  openssl enc or a cipher command (aes, aria, camellia, sm4, des, ...) that encrypts
  (no -d, or -e given as well: the last flag wins and an extra -d must not hide an
  encryption), gpg --symmetric in batch mode,
  or 7z adding to an archive with a password. Ransomware written as scripts encrypts
  user files with exactly these tools. Developers and admins also encrypt files by
  hand; a single run is a low-confidence signal, many runs in a row a strong one.
  openssl enc with only -base64 (encoding, no cipher or password option) does not match.
labels:
  tactic.id: TA0040
  tactic.name: Impact
  technique.id: T1486
  technique.name: Data Encrypted for Impact
references:
  - https://attack.mitre.org/techniques/T1486/
condition: >
  spawn_process
  and (
    (ps.name = 'openssl'
     and ps.cmdline regex '^(\\S*/)?openssl\\s+(enc(\\s|$)|-?(aes|aria|camellia|sm4|des|bf|cast|chacha20|rc2|rc4|seed|idea)[a-z0-9-]*(\\s|$))'
     and not (ps.args in ('-d', '-decrypt') and not ps.args in ('-e', '-encrypt'))
     and not (ps.args = 'enc' and ps.args in ('-base64', '-a', '-A')
              and not ps.args imatches ('-aes*', '-aria*', '-camellia*', '-sm4*', '-des*', '-bf*', '-cast*', '-chacha20*', '-rc2*', '-rc4*', '-seed*', '-idea*', '-pbkdf2', '-k', '-kfile', '-pass')))
    or (base(ps.exe) iin ('gpg', 'gpg2') and ps.args in ('-c', '--symmetric') and ps.args = '--batch')
    or (base(ps.exe) iin ('7z', '7zz', '7za') and ps.args = 'a' and ps.args imatches '-p*')
  )
output: "%ps.exe (pid %ps.pid, parent %ps.parent.exe) encrypted files: %ps.cmdline"
severity: medium
action: []
tests:
  atomic: [645f0f5a-ef09-48d8-b9bc-f0e24c642d72, 1a01f6b8-b1e8-418e-bbe3-78a6f822759e]
min-engine-version: 0.1.0
