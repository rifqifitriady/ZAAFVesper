name: Browser credential or cookie store read by another process
id: d80d3eef-bbb8-49a9-9696-3b63f3a876b5
version: 1.1.0
platforms: [macos]
description: |
  A browser's saved-password, cookie, autofill or key store (Chrome/Chromium/Brave/Edge/
  Opera/Vivaldi/Arc "Login Data", "Cookies", "Web Data", "Local State"; Firefox
  logins.json/key4.db/cookies.sqlite; Safari Cookies.binarycookies) was opened by a
  process that is not the browser. Browsers are recognised by Team ID with a Developer ID
  or App Store signing category (a self-signed binary carrying a browser's Team ID, or any
  Team ID when the category is not reported, alerts); Safari/WebKit by Apple platform
  signature. Infostealers copy these files with cp/ditto/sqlite3 or their
  own code, often via Finder (DesktopServicesHelper) to dodge TCC.
  Known benign: password-manager imports (1Password, Bitwarden) and backup tools.
labels:
  tactic.id: TA0006
  tactic.name: Credential Access
  technique.id: T1555.003
  technique.name: Credentials from Web Browsers
references:
  - https://attack.mitre.org/techniques/T1555/003/
condition: >
  open_file
  and file.path imatches browser_secret_globs
  and not (ps.is_signed = true and ps.team_id in browser_team_ids and ps.cs_category in vendor_cs_categories)
  and not (ps.is_platform = true and ps.signing_id istartswith apple_browser_signing_prefixes)
  and not (apple_trusted_process)
output: "%ps.exe (pid %ps.pid, parent %ps.parent.cmdline) read browser secret store %file.path"
severity: high
action: []
tests:
  atomic: [c1402f7b-67ca-43a8-b5f3-3143abedc01b, 124e13e5-d8a1-4378-a6ee-a53cd0c7e369, 29d0c390-3cbc-4e4e-a52b-a1350ed836b7]
min-engine-version: 0.1.0
