name: Microphone recorded from the command line
id: 6a2c8e17-9f4b-4d35-b7e0-1c3d5a9f8e42
version: 1.0.0
platforms: [macos]
description: |
  osascript made QuickTime Player start a new audio recording, or ffmpeg captured an
  AVFoundation audio device (-f avfoundation with -i ":N" or "N:M"). Spyware records the
  microphone this way. TCC still asks the user the first time unless access was already
  granted to the parent app.
labels:
  tactic.id: TA0009
  tactic.name: Collection
  technique.id: T1123
  technique.name: Audio Capture
references:
  - https://attack.mitre.org/techniques/T1123/
condition: >
  spawn_process
  and (
    (ps.name = 'osascript' and ps.cmdline icontains 'new audio recording')
    or (base(ps.exe) = 'ffmpeg' and ps.args = 'avfoundation' and ps.cmdline regex '-i\\s+"?([0-9]+)?:[0-9]+"?(\\s|$)')
  )
output: "%ps.exe (pid %ps.pid, parent %ps.parent.exe) recorded audio: %ps.cmdline"
severity: medium
action: []
tests:
  atomic: [c7a0bb71-70ce-4a53-b115-881f241b795b]
min-engine-version: 0.1.0
