name: Fake password prompt via osascript from untrusted origin
id: 6627fec8-10e4-4b34-9c26-d7c466107e9d
version: 1.5.0
platforms: [macos]
description: |
  Same password-dialog pattern as "Fake password prompt via osascript", but the origin is
  untrusted: the osascript parent has no verified developer identity (unsigned, ad-hoc,
  self-signed, or a Team ID without a Developer ID / App Store signing category), the
  parent is unknown (not in the process table, e.g. evicted by a flood), the parent or
  any ancestor runs from a mounted disk image, /tmp, /Users/Shared, Downloads, ~/Library
  or App Translocation, the ancestor chain does not reach launchd (an ancestor is
  unknown), the prompt was reparented to launchd by a double fork (ppid 1 but
  original_ppid is another process), the parent is launchd itself (ppid 1, parent
  /sbin/launchd: a LaunchAgent or LaunchDaemon started the prompt directly; owner
  decision 8 Nov 2026), or ps.ancestors_untrusted is true (pkg/ps found an
  ancestor up to launchd that is neither a platform binary nor a verified vendor identity,
  e.g. an ad-hoc payload in ~/Documents, /Applications or /opt/homebrew that runs the
  prompt through `sh -c`). That is the exact shape of DMG-delivered infostealers (Atomic Stealer,
  Banshee, Cuckoo). No legitimate installer collects the login password through an
  osascript dialog, so the false-positive risk is very low.
  Response (only with --enable-response): the rule first suspends (SIGSTOP) and then
  kills the untrusted PARENT that launched the prompt, not osascript (osascript is an Apple platform binary and is always
  protected). The response layer still refuses platform, protected-path, seeded and
  unverified processes, so when the parent is a platform shell (payload used system() or
  popen) or is unknown, nothing is killed and the alert stands alone. A double-forked
  or launchd-started prompt's parent is launchd (pid 1, always protected), so those
  cases are alert-only too. The suspend goes through the same guard rails as the kill;
  when the kill is refused (for example by the response budget), the parent is resumed
  after response.suspend_for (default 30 s). Both act after the prompt appeared.
labels:
  tactic.id: TA0006
  tactic.name: Credential Access
  technique.id: T1056.002
  technique.name: GUI Input Capture
references:
  - https://attack.mitre.org/techniques/T1056/002/
condition: >
  spawn_osascript
  and osascript_credential_prompt
  and untrusted_prompt_origin
output: "osascript (pid %ps.pid) password prompt from untrusted origin; parent %ps.parent.exe (pid %ps.ppid, signing %ps.parent.signing_id, team %ps.parent.team_id) is the kill target: %ps.cmdline"
severity: critical
action: [{name: suspend, target: parent}, {name: kill, target: parent}]
tests:
  atomic: []
min-engine-version: 0.1.0
