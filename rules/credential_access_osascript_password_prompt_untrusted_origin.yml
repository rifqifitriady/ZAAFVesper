name: Fake password prompt via osascript from untrusted origin
id: 6627fec8-10e4-4b34-9c26-d7c466107e9d
version: 1.0.0
description: |
  Same password-dialog pattern as "Fake password prompt via osascript", but the osascript
  parent has no developer identity (unsigned or ad-hoc), or the parent or any ancestor
  runs from a mounted disk image, /tmp, /Users/Shared, Downloads, ~/Library or App
  Translocation. That is the exact shape of DMG-delivered infostealers (Atomic Stealer,
  Banshee, Cuckoo). No legitimate installer collects the login password through an
  osascript dialog, so the false-positive risk is very low and the rule kills osascript
  (only when ZAAFVesper runs with --enable-response) before the victim can type.
labels:
  tactic.id: TA0006
  tactic.name: Credential Access
  technique.id: T1056.002
  technique.name: GUI Input Capture
references:
  - https://attack.mitre.org/techniques/T1056/002/
condition: >
  spawn_osascript
  and osascript_credential_prompt
  and untrusted_prompt_origin
output: "osascript (pid %ps.pid) password prompt launched by untrusted %ps.parent.exe (signing %ps.parent.signing_id): %ps.cmdline"
severity: critical
action: [{name: kill}]
tests:
  atomic: []
min-engine-version: 0.1.0
