name: SSH or GnuPG private key read by unusual process
id: 7d5e3a7d-a9e8-43aa-85ff-928ead1a1e9c
version: 1.0.0
description: |
  An SSH private key in ~/.ssh (id_*, *.pem, *.key; public keys excluded) was opened by
  something other than Apple's OpenSSH tools (platform binaries), or a generic file tool (cp, rsync, tar, cat, ...) read a GnuPG private
  key. Stealers and post-exploitation scripts sweep these files with find/cat/rsync.
  Known benign: GUI SSH clients that read keys themselves (Termius, Transmit, JetBrains
  IDEs), Homebrew-installed OpenSSH and Ansible/paramiko (Python). Developer ID alone is
  not an identity an attacker cannot obtain, so none of them is allow-listed; add a
  local vendor Team ID + signing ID pair after review.
labels:
  tactic.id: TA0006
  tactic.name: Credential Access
  technique.id: T1552.004
  technique.name: Private Keys
references:
  - https://attack.mitre.org/techniques/T1552/004/
condition: >
  open_file
  and (
    (
      file.path imatches ('/Users/*/.ssh/*', '/private/var/root/.ssh/*')
      and file.name imatches ('id_*', '*.pem', '*.key')
      and not (file.name imatches '*.pub')
      and not (ps.is_platform = true and ps.name in ('ssh', 'ssh-add', 'ssh-agent', 'ssh-keygen', 'ssh-keysign', 'sshd', 'sshd-session', 'scp', 'sftp'))
    )
    or (
      file.path imatches ('/Users/*/.gnupg/private-keys-v1.d/*', '/Users/*/.gnupg/secring.gpg')
      and ps.name in file_access_tool_names
    )
  )
  and not (apple_trusted_process)
output: "%ps.exe (pid %ps.pid, parent %ps.parent.cmdline) read private key %file.path"
severity: high
action: []
tests:
  atomic: [46959285-906d-40fa-9437-5a439accd878, 864bb0b2-6bb5-489a-b43b-a77b3a16d68a, 2a5a0601-f5fb-4e2e-aa09-73282ae6afca]
min-engine-version: 0.1.0
