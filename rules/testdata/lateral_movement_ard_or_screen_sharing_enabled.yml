match:
  - desc: "kickstart activates ARD for all users (ART T1021.005 #1)"
    events:
      - {"name": "CreateProcess", "platform": "macos", "proc": {"pid": 5901, "ppid": 4000, "exe": "/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart", "name": "kickstart", "args": ["kickstart", "-activate", "-configure", "-allowAccessFor", "-allUsers", "-privs", "-all", "-quiet"], "uid": 0, "euid": 0, "is_platform": true, "is_signed": true, "signing_id": "com.apple.kickstart", "parent": {"pid": 4000, "exe": "/usr/bin/sudo", "name": "sudo", "is_platform": true, "is_signed": true}}}
  - desc: "launchctl enables Screen Sharing"
    events:
      - {"name": "CreateProcess", "platform": "macos", "proc": {"pid": 5904, "ppid": 4000, "exe": "/bin/launchctl", "name": "launchctl", "args": ["launchctl", "enable", "system/com.apple.screensharing"], "uid": 0, "euid": 0, "is_platform": true, "is_signed": true, "signing_id": "com.apple.launchctl", "parent": {"pid": 4000, "exe": "/bin/sh", "name": "sh", "is_platform": true, "is_signed": true}}}
  - desc: "launchctl kickstart starts the Screen Sharing daemon"
    events:
      - {"name": "CreateProcess", "platform": "macos", "proc": {"pid": 5905, "ppid": 4000, "exe": "/bin/launchctl", "name": "launchctl", "args": ["launchctl", "kickstart", "-k", "system/com.apple.screensharing"], "uid": 0, "euid": 0, "is_platform": true, "is_signed": true, "signing_id": "com.apple.launchctl", "parent": {"pid": 4000, "exe": "/bin/sh", "name": "sh", "is_platform": true, "is_signed": true}}}
nomatch:
  - desc: "benign lookalike - kickstart deactivates and stops ARD"
    events:
      - {"name": "CreateProcess", "platform": "macos", "proc": {"pid": 5911, "ppid": 4000, "exe": "/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart", "name": "kickstart", "args": ["kickstart", "-deactivate", "-stop"], "uid": 0, "euid": 0, "is_platform": true, "is_signed": true, "signing_id": "com.apple.kickstart", "parent": {"pid": 4000, "exe": "/usr/bin/sudo", "name": "sudo", "is_platform": true, "is_signed": true}}}
  - desc: "launchctl disables Screen Sharing"
    events:
      - {"name": "CreateProcess", "platform": "macos", "proc": {"pid": 5914, "ppid": 4000, "exe": "/bin/launchctl", "name": "launchctl", "args": ["launchctl", "disable", "system/com.apple.screensharing"], "uid": 0, "euid": 0, "is_platform": true, "is_signed": true, "signing_id": "com.apple.launchctl", "parent": {"pid": 4000, "exe": "/bin/zsh", "name": "zsh", "is_platform": true, "is_signed": true}}}
  - desc: "launchctl kickstart restarts an unrelated daemon"
    events:
      - {"name": "CreateProcess", "platform": "macos", "proc": {"pid": 5916, "ppid": 4000, "exe": "/bin/launchctl", "name": "launchctl", "args": ["launchctl", "kickstart", "-k", "system/com.apple.mDNSResponder"], "uid": 0, "euid": 0, "is_platform": true, "is_signed": true, "signing_id": "com.apple.launchctl", "parent": {"pid": 4000, "exe": "/bin/sh", "name": "sh", "is_platform": true, "is_signed": true}}}
