match:
  - desc: "dscl deletes a user (ART T1531 dscl)"
    events:
      - {"name": "CreateProcess", "platform": "macos", "proc": {"pid": 6001, "ppid": 4000, "exe": "/usr/bin/dscl", "name": "dscl", "args": ["dscl", ".", "-delete", "/Users/ARTUserAccount"], "uid": 0, "euid": 0, "is_platform": true, "is_signed": true, "signing_id": "com.apple.dscl", "parent": {"pid": 4000, "exe": "/bin/sh", "name": "sh", "is_platform": true, "is_signed": true}}}
  - desc: "sysadminctl deletes a user (ART T1531 sysadminctl)"
    events:
      - {"name": "CreateProcess", "platform": "macos", "proc": {"pid": 6002, "ppid": 4000, "exe": "/usr/sbin/sysadminctl", "name": "sysadminctl", "args": ["sysadminctl", "-deleteUser", "ARTUserAccount"], "uid": 0, "euid": 0, "is_platform": true, "is_signed": true, "signing_id": "com.apple.sysadminctl", "parent": {"pid": 4000, "exe": "/bin/sh", "name": "sh", "is_platform": true, "is_signed": true}}}
nomatch:
  - desc: "benign lookalike - dscl reads a user record"
    events:
      - {"name": "CreateProcess", "platform": "macos", "proc": {"pid": 6011, "ppid": 4000, "exe": "/usr/bin/dscl", "name": "dscl", "args": ["dscl", ".", "-read", "/Users/rifqi"], "uid": 501, "euid": 501, "is_platform": true, "is_signed": true, "signing_id": "com.apple.dscl", "parent": {"pid": 4000, "exe": "/bin/zsh", "name": "zsh", "is_platform": true, "is_signed": true}}}
  - desc: "sysadminctl adds a user"
    events:
      - {"name": "CreateProcess", "platform": "macos", "proc": {"pid": 6012, "ppid": 4000, "exe": "/usr/sbin/sysadminctl", "name": "sysadminctl", "args": ["sysadminctl", "-addUser", "guest2"], "uid": 0, "euid": 0, "is_platform": true, "is_signed": true, "signing_id": "com.apple.sysadminctl", "parent": {"pid": 4000, "exe": "/bin/zsh", "name": "zsh", "is_platform": true, "is_signed": true}}}
  - desc: "dscl deletes a group membership under /Groups"
    events:
      - {"name": "CreateProcess", "platform": "macos", "proc": {"pid": 6013, "ppid": 4000, "exe": "/usr/bin/dscl", "name": "dscl", "args": ["dscl", ".", "-delete", "/Groups/admin", "GroupMembership", "olduser"], "uid": 0, "euid": 0, "is_platform": true, "is_signed": true, "signing_id": "com.apple.dscl", "parent": {"pid": 4000, "exe": "/bin/zsh", "name": "zsh", "is_platform": true, "is_signed": true}}}
