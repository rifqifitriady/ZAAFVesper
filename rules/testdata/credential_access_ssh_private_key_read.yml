match:
  - desc: forged - binary named ssh outside SIP (not a platform binary) reads a key
    events:
      - name: OpenFile
        proc: {pid: 4705, ppid: 4700, exe: /Users/Shared/.bin/ssh, name: ssh, uid: 501, euid: 501, signing_id: com.apple.ssh, is_platform: false, is_signed: false}
        file: {path: /Users/rifqi/.ssh/id_ed25519}
  - desc: 'find / -name id_rsa -exec sh -c ''cat "$1"'' (ART T1552.004 #2) - cat opens the key'
    events:
      - name: OpenFile
        proc: {pid: 4701, ppid: 4700, exe: /bin/cat, name: cat, cmdline: "cat /Users/rifqi/.ssh/id_rsa", args: [cat, /Users/rifqi/.ssh/id_rsa], uid: 501, euid: 501, signing_id: com.apple.cat, is_platform: true, is_signed: true}
        file: {path: /Users/rifqi/.ssh/id_rsa}
  - desc: 'rsync -R copies id_rsa to /tmp/art-staging (ART T1552.004 #5)'
    events:
      - name: OpenFile
        proc: {pid: 4702, ppid: 4700, exe: /usr/bin/rsync, name: rsync, cmdline: "rsync -R /Users/rifqi/.ssh/id_rsa /tmp/art-staging", args: [rsync, -R, /Users/rifqi/.ssh/id_rsa, /tmp/art-staging], uid: 501, euid: 501, signing_id: com.apple.rsync, is_platform: true, is_signed: true}
        file: {path: /Users/rifqi/.ssh/id_rsa}
  - desc: 'rsync -Rr copies the GnuPG directory (ART T1552.004 #7)'
    events:
      - name: OpenFile
        proc: {pid: 4703, ppid: 4700, exe: /usr/bin/rsync, name: rsync, cmdline: "rsync -Rr /Users/rifqi/.gnupg /tmp/GnuPG", args: [rsync, -Rr, /Users/rifqi/.gnupg, /tmp/GnuPG], uid: 501, euid: 501, signing_id: com.apple.rsync, is_platform: true, is_signed: true}
        file: {path: /Users/rifqi/.gnupg/private-keys-v1.d/0123456789ABCDEF0123456789ABCDEF01234567.key}
nomatch:
  - desc: benign lookalike - /usr/bin/ssh reads ~/.ssh/id_ed25519
    events:
      - name: OpenFile
        proc: {pid: 4711, ppid: 4710, exe: /usr/bin/ssh, name: ssh, cmdline: "ssh git@github.com", args: [ssh, git@github.com], uid: 501, euid: 501, signing_id: com.apple.ssh, is_platform: true, is_signed: true}
        file: {path: /Users/rifqi/.ssh/id_ed25519}
  - desc: benign lookalike - Apple ssh-keygen (platform) reads the private key to derive a public key
    events:
      - name: OpenFile
        proc: {pid: 4715, ppid: 4710, exe: /usr/bin/ssh-keygen, name: ssh-keygen, uid: 501, euid: 501, signing_id: com.apple.ssh-keygen, is_platform: true, is_signed: true}
        file: {path: /Users/rifqi/.ssh/id_ed25519}
  - desc: benign lookalike - cat of a public key and gpg-agent reading its own key store
    events:
      - name: OpenFile
        proc: {pid: 4713, ppid: 4710, exe: /bin/cat, name: cat, uid: 501, euid: 501, signing_id: com.apple.cat, is_platform: true, is_signed: true}
        file: {path: /Users/rifqi/.ssh/id_ed25519.pub}
      - name: OpenFile
        proc: {pid: 4714, ppid: 1, exe: /opt/homebrew/Cellar/gnupg/2.4.7/bin/gpg-agent, name: gpg-agent, uid: 501, euid: 501, is_platform: false, is_signed: false}
        file: {path: /Users/rifqi/.gnupg/private-keys-v1.d/0123456789ABCDEF0123456789ABCDEF01234567.key}
