nomatch:
  - desc: benign lookalike - script asks for a project name (default answer, not hidden, no password)
    events:
      - name: CreateProcess
        proc: {pid: 4511, ppid: 4510, exe: /usr/bin/osascript, name: osascript, cmdline: "osascript -e display dialog \"Project name?\" default answer \"untitled\"", args: [osascript, -e, "display dialog \"Project name?\" default answer \"untitled\""], uid: 501, euid: 501, signing_id: com.apple.osascript, is_platform: true, is_signed: true, parent: {pid: 4510, ppid: 1, exe: /bin/zsh, name: zsh, signing_id: com.apple.zsh, is_platform: true, is_signed: true}}
  - desc: benign lookalike - informational dialog with no text field
    events:
      - name: CreateProcess
        proc: {pid: 4512, ppid: 4510, exe: /usr/bin/osascript, name: osascript, cmdline: "osascript -e display dialog \"Backup finished\" buttons {\"OK\"}", args: [osascript, -e, "display dialog \"Backup finished\" buttons {\"OK\"}"], uid: 501, euid: 501, signing_id: com.apple.osascript, is_platform: true, is_signed: true, parent: {pid: 4510, ppid: 1, exe: /bin/zsh, name: zsh, signing_id: com.apple.zsh, is_platform: true, is_signed: true}}
