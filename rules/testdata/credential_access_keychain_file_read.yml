match:
  - desc: 'cat ~/Library/Keychains/login.keychain-db > /tmp/keychain (ART T1555.001 #4)'
    events:
      - name: OpenFile
        proc: {pid: 4401, ppid: 4400, exe: /bin/cat, name: cat, cmdline: "cat /Users/rifqi/Library/Keychains/login.keychain-db", args: [cat, /Users/rifqi/Library/Keychains/login.keychain-db], uid: 501, euid: 501, signing_id: com.apple.cat, is_platform: true, is_signed: true}
        file: {path: /Users/rifqi/Library/Keychains/login.keychain-db}
  - desc: ad-hoc stealer opens the System keychain master key
    events:
      - name: OpenFile
        proc: {pid: 4402, ppid: 1, exe: /Volumes/Player/Player.app/Contents/MacOS/Player, name: Player, uid: 0, euid: 0, signing_id: Player-55554944, is_platform: false, is_signed: false}
        file: {path: /private/var/db/SystemKey}
nomatch:
  - desc: benign lookalike - securityd opens the login keychain
    events:
      - name: OpenFile
        proc: {pid: 150, ppid: 1, exe: /usr/sbin/securityd, name: securityd, uid: 0, euid: 0, signing_id: com.apple.securityd, is_platform: true, is_signed: true}
        file: {path: /Users/rifqi/Library/Keychains/login.keychain-db}
  - desc: benign lookalike - Developer ID app reads the keychain through Security.framework
    events:
      - name: OpenFile
        proc: {pid: 4411, ppid: 1, exe: /Applications/Slack.app/Contents/MacOS/Slack, name: Slack, uid: 501, euid: 501, signing_id: com.tinyspeck.slackmacgap, team_id: BQR82RBBHL, is_platform: false, is_signed: true}
        file: {path: /Users/rifqi/Library/Keychains/login.keychain-db}
  - desc: cat reading an unrelated file
    events:
      - name: OpenFile
        proc: {pid: 4412, ppid: 4410, exe: /bin/cat, name: cat, uid: 501, euid: 501, signing_id: com.apple.cat, is_platform: true, is_signed: true}
        file: {path: /Users/rifqi/notes.txt}
