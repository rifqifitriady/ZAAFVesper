match:
  - desc: ad-hoc signed app on a mounted DMG prompts for the login password (AMOS pattern)
    events:
      - name: CreateProcess
        proc: {pid: 4601, ppid: 4600, exe: /usr/bin/osascript, name: osascript, cmdline: "osascript -e display dialog \"Required Application Helper. Please enter device password to continue.\" default answer \"\" with icon caution buttons {\"Continue\"} default button \"Continue\" giving up after 150 with title \"Application wants to install helper\" with hidden answer", args: [osascript, -e, "display dialog \"Required Application Helper. Please enter device password to continue.\" default answer \"\" with icon caution buttons {\"Continue\"} default button \"Continue\" giving up after 150 with title \"Application wants to install helper\" with hidden answer"], uid: 501, euid: 501, signing_id: com.apple.osascript, is_platform: true, is_signed: true, parent: {pid: 4600, ppid: 1, exe: /Volumes/CleanMyMac/CleanMyMac.app/Contents/MacOS/CleanMyMac, name: CleanMyMac, signing_id: CleanMyMac-555549440bad, is_platform: false, is_signed: false}, ancestors: [/Volumes/CleanMyMac/CleanMyMac.app/Contents/MacOS/CleanMyMac, /sbin/launchd]}
  - desc: payload calls system() so the parent is /bin/sh but the ancestor runs from /Users/Shared
    events:
      - name: CreateProcess
        proc: {pid: 4602, ppid: 4603, exe: /usr/bin/osascript, name: osascript, cmdline: "osascript -l JavaScript -e var app=Application.currentApplication();app.includeStandardAdditions=true;app.displayDialog('macOS needs your password',{defaultAnswer:'',hiddenAnswer:true})", args: [osascript, -l, JavaScript, -e, "var app=Application.currentApplication();app.includeStandardAdditions=true;app.displayDialog('macOS needs your password',{defaultAnswer:'',hiddenAnswer:true})"], uid: 501, euid: 501, signing_id: com.apple.osascript, is_platform: true, is_signed: true, parent: {pid: 4603, ppid: 4604, exe: /bin/sh, name: sh, signing_id: com.apple.sh, is_platform: true, is_signed: true}, ancestors: [/bin/sh, /Users/Shared/.svc/svc, /sbin/launchd]}
  - desc: self-signed parent (is_signed true, no Team ID) outside user-writable folders still counts as untrusted
    events:
      - name: CreateProcess
        proc: {pid: 4605, ppid: 4606, exe: /usr/bin/osascript, name: osascript, cmdline: "osascript -e display dialog \"System Preferences wants to make changes. Enter your password to allow this.\" default answer \"\" with hidden answer", args: [osascript, -e, "display dialog \"System Preferences wants to make changes. Enter your password to allow this.\" default answer \"\" with hidden answer"], uid: 501, euid: 501, signing_id: com.apple.osascript, is_platform: true, is_signed: true, parent: {pid: 4606, ppid: 1, exe: /Applications/Helper.app/Contents/MacOS/Helper, name: Helper, signing_id: com.apple.systempreferences, is_platform: false, is_signed: true}, ancestors: [/Applications/Helper.app/Contents/MacOS/Helper, /sbin/launchd]}
  - desc: unknown parent - payload evicted from the process table by a flood (no ps.parent at all) still counts as untrusted
    events:
      - name: CreateProcess
        proc: {pid: 4620, ppid: 4619, exe: /usr/bin/osascript, name: osascript, cmdline: "osascript -e display dialog \"macOS needs your password to continue.\" default answer \"\" with hidden answer", args: [osascript, -e, "display dialog \"macOS needs your password to continue.\" default answer \"\" with hidden answer"], uid: 501, euid: 501, signing_id: com.apple.osascript, is_platform: true, is_signed: true}
  - desc: platform shell parent but the ancestor chain stops before launchd (payload ancestor evicted) - unknown ancestor = untrusted
    events:
      - name: CreateProcess
        proc: {pid: 4621, ppid: 4622, exe: /usr/bin/osascript, name: osascript, cmdline: "osascript -e display dialog \"macOS needs your password to continue.\" default answer \"\" with hidden answer", args: [osascript, -e, "display dialog \"macOS needs your password to continue.\" default answer \"\" with hidden answer"], uid: 501, euid: 501, signing_id: com.apple.osascript, is_platform: true, is_signed: true, parent: {pid: 4622, ppid: 4619, exe: /bin/sh, name: sh, signing_id: com.apple.sh, is_platform: true, is_signed: true}, ancestors: [/bin/sh]}
  - desc: forged Team ID - same Team ID as a real vendor but cs_category local_signing (self-signed) is untrusted
    events:
      - name: CreateProcess
        proc: {pid: 4623, ppid: 4624, exe: /usr/bin/osascript, name: osascript, cmdline: "osascript -e display dialog \"macOS needs your password to continue.\" default answer \"\" with hidden answer", args: [osascript, -e, "display dialog \"macOS needs your password to continue.\" default answer \"\" with hidden answer"], uid: 501, euid: 501, signing_id: com.apple.osascript, is_platform: true, is_signed: true, parent: {pid: 4624, ppid: 1, exe: /Applications/PDF Tools.app/Contents/MacOS/PDF Tools, name: PDF Tools, signing_id: com.pdftools.mac, team_id: 7Q2LBN6W4C, is_platform: false, is_signed: true, cs_category: local_signing}, ancestors: [/Applications/PDF Tools.app/Contents/MacOS/PDF Tools, /sbin/launchd]}
  - desc: Team ID with no reported signing category (older macOS) fails closed - untrusted
    events:
      - name: CreateProcess
        proc: {pid: 4625, ppid: 4626, exe: /usr/bin/osascript, name: osascript, cmdline: "osascript -e display dialog \"macOS needs your password to continue.\" default answer \"\" with hidden answer", args: [osascript, -e, "display dialog \"macOS needs your password to continue.\" default answer \"\" with hidden answer"], uid: 501, euid: 501, signing_id: com.apple.osascript, is_platform: true, is_signed: true, parent: {pid: 4626, ppid: 1, exe: /Applications/PDF Tools.app/Contents/MacOS/PDF Tools, name: PDF Tools, signing_id: com.pdftools.mac, team_id: 7Q2LBN6W4C, is_platform: false, is_signed: true}, ancestors: [/Applications/PDF Tools.app/Contents/MacOS/PDF Tools, /sbin/launchd]}
  - desc: SEC-R3 double-fork - payload in /Users/Shared forks a child that waits to be reparented to launchd, then execs the prompt (original_ppid 4700 = the payload)
    events:
      - name: CreateProcess
        proc: {pid: 4701, ppid: 1, original_ppid: 4700, exe: /usr/bin/osascript, name: osascript, cmdline: "osascript -e display dialog \"macOS needs your password to continue.\" default answer \"\" with hidden answer", args: [osascript, -e, "display dialog \"macOS needs your password to continue.\" default answer \"\" with hidden answer"], uid: 501, euid: 501, signing_id: com.apple.osascript, is_platform: true, is_signed: true, parent: {pid: 1, ppid: 0, exe: /sbin/launchd, name: launchd, signing_id: com.apple.xpc.launchd, is_platform: true, is_signed: true, cs_category: platform}, ancestors: [/sbin/launchd]}
  - desc: SEC-R4 system() from ad-hoc payload in ~/Documents
    events:
      - name: CreateProcess
        proc: {pid: 4710, ppid: 4711, exe: /usr/bin/osascript, name: osascript, cmdline: "osascript -e display dialog \"macOS needs your password to continue.\" default answer \"\" with hidden answer", args: [osascript, -e, "display dialog \"macOS needs your password to continue.\" default answer \"\" with hidden answer"], uid: 501, euid: 501, signing_id: com.apple.osascript, is_platform: true, is_signed: true, ancestors_untrusted: true, parent: {pid: 4711, ppid: 4712, exe: /bin/sh, name: sh, signing_id: com.apple.sh, is_platform: true, is_signed: true, cs_category: platform}, ancestors: [/bin/sh, /Users/rifqi/Documents/tool/agent, /sbin/launchd]}
  - desc: SEC-R4 system() from ad-hoc payload in /Applications (admin-writable)
    events:
      - name: CreateProcess
        proc: {pid: 4710, ppid: 4711, exe: /usr/bin/osascript, name: osascript, cmdline: "osascript -e display dialog \"macOS needs your password to continue.\" default answer \"\" with hidden answer", args: [osascript, -e, "display dialog \"macOS needs your password to continue.\" default answer \"\" with hidden answer"], uid: 501, euid: 501, signing_id: com.apple.osascript, is_platform: true, is_signed: true, ancestors_untrusted: true, parent: {pid: 4711, ppid: 4712, exe: /bin/sh, name: sh, signing_id: com.apple.sh, is_platform: true, is_signed: true, cs_category: platform}, ancestors: [/bin/sh, /Applications/PDF Helper.app/Contents/MacOS/PDF Helper, /sbin/launchd]}
  - desc: SEC-R4 system() from payload in /opt/homebrew (user-owned on Apple Silicon)
    events:
      - name: CreateProcess
        proc: {pid: 4710, ppid: 4711, exe: /usr/bin/osascript, name: osascript, cmdline: "osascript -e display dialog \"macOS needs your password to continue.\" default answer \"\" with hidden answer", args: [osascript, -e, "display dialog \"macOS needs your password to continue.\" default answer \"\" with hidden answer"], uid: 501, euid: 501, signing_id: com.apple.osascript, is_platform: true, is_signed: true, ancestors_untrusted: true, parent: {pid: 4711, ppid: 4712, exe: /bin/sh, name: sh, signing_id: com.apple.sh, is_platform: true, is_signed: true, cs_category: platform}, ancestors: [/bin/sh, /opt/homebrew/bin/updater, /sbin/launchd]}
  - desc: F3 residual (owner decision 8 Nov 2026) - prompt started directly by launchd (LaunchAgent, original_ppid 1) counts as untrusted origin; the kill target is launchd, so alert-only
    events:
      - name: CreateProcess
        proc: {pid: 4702, ppid: 1, original_ppid: 1, exe: /usr/bin/osascript, name: osascript, cmdline: "osascript -e display dialog \"macOS needs your password to continue.\" default answer \"\" with hidden answer", args: [osascript, -e, "display dialog \"macOS needs your password to continue.\" default answer \"\" with hidden answer"], uid: 501, euid: 501, signing_id: com.apple.osascript, is_platform: true, is_signed: true, parent: {pid: 1, ppid: 0, exe: /sbin/launchd, name: launchd, signing_id: com.apple.xpc.launchd, is_platform: true, is_signed: true, cs_category: platform}, ancestors: [/sbin/launchd]}
  - desc: launchd-parented prompt without a reported original_ppid is an untrusted origin too (launchd_parent does not need original_ppid)
    events:
      - name: CreateProcess
        proc: {pid: 4703, ppid: 1, exe: /usr/bin/osascript, name: osascript, cmdline: "osascript -e display dialog \"macOS needs your password to continue.\" default answer \"\" with hidden answer", args: [osascript, -e, "display dialog \"macOS needs your password to continue.\" default answer \"\" with hidden answer"], uid: 501, euid: 501, signing_id: com.apple.osascript, is_platform: true, is_signed: true, parent: {pid: 1, ppid: 0, exe: /sbin/launchd, name: launchd, signing_id: com.apple.xpc.launchd, is_platform: true, is_signed: true, cs_category: platform}, ancestors: [/sbin/launchd]}
  - desc: F3 residual - JXA prompt from a user LaunchAgent (ppid 1, original_ppid 1, parent /sbin/launchd, every ancestor trusted) is critical; kill target launchd is refused, alert-only
    events:
      - name: CreateProcess
        proc: {pid: 4705, ppid: 1, original_ppid: 1, exe: /usr/bin/osascript, name: osascript, cmdline: "osascript -l JavaScript -e var app=Application.currentApplication();app.includeStandardAdditions=true;app.displayDialog('Software Update needs your password',{defaultAnswer:'',hiddenAnswer:true})", args: [osascript, -l, JavaScript, -e, "var app=Application.currentApplication();app.includeStandardAdditions=true;app.displayDialog('Software Update needs your password',{defaultAnswer:'',hiddenAnswer:true})"], uid: 501, euid: 501, signing_id: com.apple.osascript, is_platform: true, is_signed: true, ancestors_untrusted: false, parent: {pid: 1, ppid: 0, exe: /sbin/launchd, name: launchd, signing_id: com.apple.xpc.launchd, is_platform: true, is_signed: true, cs_category: platform}, ancestors: [/sbin/launchd]}
