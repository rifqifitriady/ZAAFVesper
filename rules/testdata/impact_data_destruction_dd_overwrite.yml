match:
  - desc: "GNU dd duplicate of= (last wins) hides behind of=/swapfile"
    events:
      - {"name": "CreateProcess", "platform": "linux", "proc": {"pid": 5, "ppid": 4000, "exe": "/usr/bin/dd", "name": "dd", "uid": 1000, "euid": 1000, "username": "alice", "cmdline": "dd if=/dev/zero of=/swapfile of=/home/alice/thesis.docx bs=1M count=10", "args": ["dd", "if=/dev/zero", "of=/swapfile", "of=/home/alice/thesis.docx", "bs=1M", "count=10"], "parent": {"pid": 4000, "exe": "/usr/bin/bash", "name": "bash"}}}
  - desc: "same with pre-existing of=/dev/null"
    events:
      - {"name": "CreateProcess", "platform": "linux", "proc": {"pid": 6, "ppid": 4000, "exe": "/usr/bin/dd", "name": "dd", "uid": 1000, "euid": 1000, "username": "alice", "cmdline": "dd if=/dev/zero of=/dev/null of=/home/alice/thesis.docx", "args": ["dd", "if=/dev/zero", "of=/dev/null", "of=/home/alice/thesis.docx"], "parent": {"pid": 4000, "exe": "/usr/bin/bash", "name": "bash"}}}
  - desc: "dd overwrites a log with zeros (ART T1485 #2)"
    events:
      - {"name": "CreateProcess", "platform": "macos", "proc": {"pid": 5601, "ppid": 4000, "exe": "/bin/dd", "name": "dd", "args": ["dd", "of=/var/log/syslog", "if=/dev/zero", "count=2048", "iflag=count_bytes"], "uid": 501, "euid": 501, "is_platform": true, "is_signed": true, "signing_id": "com.apple.dd", "parent": {"pid": 4000, "exe": "/bin/sh", "name": "sh", "is_platform": true, "is_signed": true}}}
  - desc: "dd over a block device on Linux"
    events:
      - {"name": "CreateProcess", "platform": "linux", "proc": {"pid": 24504, "ppid": 24000, "exe": "/usr/bin/dd", "name": "dd", "uid": -1, "euid": -1, "username": "root", "cmdline": "dd if=/dev/urandom of=/dev/sda bs=1M", "args": ["dd", "if=/dev/urandom", "of=/dev/sda", "bs=1M"], "parent": {"pid": 24000, "exe": "/usr/bin/bash", "name": "bash"}}}
  - desc: "temp prefix that climbs out of /private/tmp"
    events:
      - {"name": "CreateProcess", "platform": "macos", "proc": {"pid": 5602, "ppid": 4000, "exe": "/bin/dd", "name": "dd", "args": ["dd", "if=/dev/urandom", "of=/private/tmp/../../Users/rifqi/Documents/a.docx", "conv=notrunc"], "uid": 501, "euid": 501, "is_platform": true, "is_signed": true, "signing_id": "com.apple.dd", "parent": {"pid": 4000, "exe": "/bin/sh", "name": "sh", "is_platform": true, "is_signed": true}}}
  - desc: "stdin written to a raw disk"
    events:
      - {"name": "CreateProcess", "platform": "macos", "proc": {"pid": 5603, "ppid": 4000, "exe": "/bin/dd", "name": "dd", "args": ["dd", "of=/dev/rdisk2", "bs=1m"], "uid": 0, "euid": 0, "is_platform": true, "is_signed": true, "signing_id": "com.apple.dd", "parent": {"pid": 4000, "exe": "/bin/sh", "name": "sh", "is_platform": true, "is_signed": true}}}
nomatch:
  - desc: "benign lookalike - dd speed test into /tmp"
    events:
      - {"name": "CreateProcess", "platform": "macos", "proc": {"pid": 5611, "ppid": 4000, "exe": "/bin/dd", "name": "dd", "args": ["dd", "if=/dev/zero", "of=/tmp/testfile", "bs=1m", "count=100"], "uid": 501, "euid": 501, "is_platform": true, "is_signed": true, "signing_id": "com.apple.dd", "tty": "/dev/ttys001", "parent": {"pid": 4000, "exe": "/bin/zsh", "name": "zsh", "is_platform": true, "is_signed": true}}}
  - desc: "dd copies an image to a USB stick (input file given)"
    events:
      - {"name": "CreateProcess", "platform": "macos", "proc": {"pid": 5613, "ppid": 4000, "exe": "/bin/dd", "name": "dd", "args": ["dd", "if=/Users/rifqi/Downloads/ubuntu.iso", "of=/dev/rdisk5", "bs=4m"], "uid": 0, "euid": 0, "is_platform": true, "is_signed": true, "signing_id": "com.apple.dd", "parent": {"pid": 4000, "exe": "/bin/zsh", "name": "zsh", "is_platform": true, "is_signed": true}}}
  - desc: "dd reads a disk into an image file"
    events:
      - {"name": "CreateProcess", "platform": "linux", "proc": {"pid": 24514, "ppid": 24000, "exe": "/usr/bin/dd", "name": "dd", "uid": -1, "euid": -1, "username": "root", "cmdline": "dd if=/dev/sda of=/backup/sda.img bs=4M", "args": ["dd", "if=/dev/sda", "of=/backup/sda.img", "bs=4M"], "parent": {"pid": 24000, "exe": "/usr/bin/bash", "name": "bash"}}}
  - desc: "dd creates a swap file on Linux"
    events:
      - {"name": "CreateProcess", "platform": "linux", "proc": {"pid": 24516, "ppid": 24000, "exe": "/usr/bin/dd", "name": "dd", "uid": -1, "euid": -1, "username": "root", "cmdline": "dd if=/dev/zero of=/swapfile bs=1M count=2048", "args": ["dd", "if=/dev/zero", "of=/swapfile", "bs=1M", "count=2048"], "parent": {"pid": 24000, "exe": "/usr/bin/bash", "name": "bash"}}}
