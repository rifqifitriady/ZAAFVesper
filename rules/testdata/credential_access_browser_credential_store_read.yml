match:
  - desc: 'cp Chrome "Login Data" to /tmp (ART T1555.003 #14)'
    events:
      - name: OpenFile
        proc: {pid: 4801, ppid: 4800, exe: /bin/cp, name: cp, cmdline: "cp /Users/rifqi/Library/Application Support/Google/Chrome/Default/Login Data /tmp/T1555.003_Login Data", args: [cp, "/Users/rifqi/Library/Application Support/Google/Chrome/Default/Login Data", "/tmp/T1555.003_Login Data"], uid: 501, euid: 501, signing_id: com.apple.cp, is_platform: true, is_signed: true}
        file: {path: /Users/rifqi/Library/Application Support/Google/Chrome/Default/Login Data}
  - desc: 'sqlite3 queries Login Data in place (ART T1555.003 #18)'
    events:
      - name: OpenFile
        proc: {pid: 4802, ppid: 4800, exe: /usr/bin/sqlite3, name: sqlite3, cmdline: "sqlite3 file:/Users/rifqi/Library/Application Support/Google/Chrome/Default/Login Data?immutable=1 SELECT origin_url, username_value FROM logins;", args: [sqlite3, "file:/Users/rifqi/Library/Application Support/Google/Chrome/Default/Login Data?immutable=1", "SELECT origin_url, username_value FROM logins;"], uid: 501, euid: 501, signing_id: com.apple.sqlite3, is_platform: true, is_signed: true}
        file: {path: /Users/rifqi/Library/Application Support/Google/Chrome/Default/Login Data}
  - desc: 'grep searches Safari cookies (ART T1555.003 #2)'
    events:
      - name: OpenFile
        proc: {pid: 4803, ppid: 4800, exe: /usr/bin/grep, name: grep, cmdline: "grep -q coinbase Cookies.binarycookies", args: [grep, -q, coinbase, Cookies.binarycookies], cwd: /Users/rifqi/Library/Cookies, uid: 501, euid: 501, signing_id: com.apple.grep, is_platform: true, is_signed: true}
        file: {path: /Users/rifqi/Library/Cookies/Cookies.binarycookies}
  - desc: ad-hoc stealer reads Firefox logins.json
    events:
      - name: OpenFile
        proc: {pid: 4804, ppid: 1, exe: /Volumes/Setup/Setup.app/Contents/MacOS/Setup, name: Setup, uid: 501, euid: 501, signing_id: Setup-55554944, is_platform: false, is_signed: false}
        file: {path: /Users/rifqi/Library/Application Support/Firefox/Profiles/abcd1234.default-release/logins.json}
  - desc: forged - binary claiming Chrome's signing_id under a different Team ID
    events:
      - name: OpenFile
        proc: {pid: 4805, ppid: 1, exe: /Users/rifqi/Library/Application Support/.gc/Google Chrome Helper, name: Google Chrome Helper, uid: 501, euid: 501, signing_id: com.google.Chrome.helper, team_id: QX7Z2K9P4L, is_platform: false, is_signed: true}
        file: {path: /Users/rifqi/Library/Application Support/Google/Chrome/Default/Login Data}
nomatch:
  - desc: benign lookalike - Chrome (team EQHXZ8M8AV) opens its own Login Data
    events:
      - name: OpenFile
        proc: {pid: 4811, ppid: 1, exe: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome, name: Google Chrome, uid: 501, euid: 501, signing_id: com.google.Chrome, team_id: EQHXZ8M8AV, is_platform: false, is_signed: true}
        file: {path: /Users/rifqi/Library/Application Support/Google/Chrome/Default/Login Data}
  - desc: benign lookalike - Safari's WebKit networking process opens the cookie store
    events:
      - name: OpenFile
        proc: {pid: 4812, ppid: 1, exe: /System/Library/Frameworks/WebKit.framework/Versions/A/XPCServices/com.apple.WebKit.Networking.xpc/Contents/MacOS/com.apple.WebKit.Networking, name: com.apple.WebKit.Networking, uid: 501, euid: 501, signing_id: com.apple.WebKit.Networking, is_platform: true, is_signed: true}
        file: {path: /Users/rifqi/Library/Containers/com.apple.Safari/Data/Library/Cookies/Cookies.binarycookies}
  - desc: cp of a non-secret Chrome profile file (Preferences)
    events:
      - name: OpenFile
        proc: {pid: 4813, ppid: 4800, exe: /bin/cp, name: cp, uid: 501, euid: 501, signing_id: com.apple.cp, is_platform: true, is_signed: true}
        file: {path: /Users/rifqi/Library/Application Support/Google/Chrome/Default/Preferences}
