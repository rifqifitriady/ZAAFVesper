match:
  - desc: 'sudo security dump-keychain -d login.keychain (ART T1555.001 #1)'
    events:
      - name: CreateProcess
        proc: {pid: 4301, ppid: 4300, exe: /usr/bin/security, name: security, cmdline: "security dump-keychain -d login.keychain", args: [security, dump-keychain, -d, login.keychain], uid: 0, euid: 0, signing_id: com.apple.security, is_platform: true, is_signed: true}
  - desc: stealer reads Chrome Safe Storage key
    events:
      - name: CreateProcess
        proc: {pid: 4302, ppid: 4300, exe: /usr/bin/security, name: security, cmdline: "security find-generic-password -wa Chrome Safe Storage", args: [security, find-generic-password, -wa, "Chrome Safe Storage"], uid: 501, euid: 501, signing_id: com.apple.security, is_platform: true, is_signed: true}
nomatch:
  - desc: benign lookalike - developer lists code-signing identities
    events:
      - name: CreateProcess
        proc: {pid: 4311, ppid: 4310, exe: /usr/bin/security, name: security, cmdline: "security find-identity -v -p codesigning", args: [security, find-identity, -v, -p, codesigning], uid: 501, euid: 501, signing_id: com.apple.security, is_platform: true, is_signed: true}
  - desc: benign lookalike - existence check without printing the secret
    events:
      - name: CreateProcess
        proc: {pid: 4312, ppid: 4310, exe: /usr/bin/security, name: security, cmdline: "security find-generic-password -s gh:github.com -a rifqi", args: [security, find-generic-password, -s, "gh:github.com", -a, rifqi], uid: 501, euid: 501, signing_id: com.apple.security, is_platform: true, is_signed: true}
