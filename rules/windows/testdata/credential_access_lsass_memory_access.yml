match:
  - desc: procdump -ma lsass.exe from a download folder (ART T1003.001 ProcDump)
    events:
      - name: OpenProcess
        platform: windows
        proc: {pid: 6228, exe: 'C:\Users\alice\Downloads\procdump64.exe', name: procdump64.exe, uid: -1, euid: -1}
        target: {pid: 720, exe: 'C:\Windows\system32\lsass.exe', name: lsass.exe, uid: -1, euid: -1}
        args: {granted_access: '0x1fffff'}
  - desc: rundll32 comsvcs.dll MiniDump (ART T1003.001 comsvcs)
    events:
      - name: OpenProcess
        platform: windows
        proc: {pid: 6300, exe: 'C:\Windows\System32\rundll32.exe', name: rundll32.exe, uid: -1, euid: -1}
        target: {pid: 720, exe: 'C:\Windows\system32\lsass.exe', name: lsass.exe, uid: -1, euid: -1}
        args: {granted_access: '0x1410'}
nomatch:
  - desc: benign lookalike - svchost queries lsass with limited rights
    events:
      - name: OpenProcess
        platform: windows
        proc: {pid: 1200, exe: 'C:\Windows\System32\svchost.exe', name: svchost.exe, uid: -1, euid: -1}
        target: {pid: 720, exe: 'C:\Windows\system32\lsass.exe', name: lsass.exe, uid: -1, euid: -1}
        args: {granted_access: '0x1fffff'}
  - desc: task manager reads another process's information only
    events:
      - name: OpenProcess
        platform: windows
        proc: {pid: 5000, exe: 'C:\Windows\System32\Taskmgr.exe', name: Taskmgr.exe, uid: -1, euid: -1}
        target: {pid: 720, exe: 'C:\Windows\system32\lsass.exe', name: lsass.exe, uid: -1, euid: -1}
        args: {granted_access: '0x1000'}
