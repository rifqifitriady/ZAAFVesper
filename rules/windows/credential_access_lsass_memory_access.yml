name: LSASS process memory opened for reading
id: 7df909f5-8a53-424b-8d92-b3e3faddef2c
version: 1.0.0
platforms: [windows]
description: |
  A process opened lsass.exe with an access mask that allows reading its memory
  (PROCESS_VM_READ with query rights: 0x1010, 0x1410, 0x1438, 0x143a, 0x1fffff), as
  credential dumpers (Mimikatz, procdump -ma lsass, comsvcs MiniDump) do. Windows
  components that legitimately open LSASS (wininit, csrss, svchost from System32,
  Defender's MsMpEng) are excluded by path.
  Known benign: other EDR or backup agents; exclude them by full image path.
labels:
  tactic.id: TA0006
  tactic.name: Credential Access
  technique.id: T1003.001
  technique.name: LSASS Memory
references:
  - https://attack.mitre.org/techniques/T1003/001/
condition: >
  evt.name = 'OpenProcess'
  and target.ps.name iin ('lsass.exe')
  and evt.arg[granted_access] iin ('0x1010', '0x1410', '0x1438', '0x143a', '0x1fffff')
  and not ps.exe iin ('C:\\Windows\\System32\\wininit.exe', 'C:\\Windows\\System32\\csrss.exe',
                      'C:\\Windows\\System32\\svchost.exe', 'C:\\Windows\\System32\\lsass.exe')
  and not ps.exe imatches ('C:\\ProgramData\\Microsoft\\Windows Defender\\Platform\\*\\MsMpEng.exe')
output: "%ps.exe (pid %ps.pid) opened lsass.exe with access %evt.arg[granted_access]"
severity: critical
action: []
tests:
  atomic: [0be2230c-9ab3-4ac2-8826-3199b9a0ebf8, 7cede33f-0acd-44ef-9774-15511300b24b, 2536dee2-12fb-459a-8c37-971844fa73be]
min-engine-version: 0.1.0
