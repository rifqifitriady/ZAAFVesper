name: Keychain secrets dumped with security CLI
id: c7d762cb-53f7-4f40-a884-93d218473949
version: 1.0.0
description: |
  /usr/bin/security was used to dump a keychain, print a stored password (-w / -g on
  find-generic-password or find-internet-password), unlock a keychain with a password on
  the command line, export private keys, or look up a browser's "Safe Storage" key (the
  key that decrypts Chromium cookies and passwords; a staple of macOS infostealers).
  Known benign: developer scripts that read their own token with
  `security find-generic-password -s <name> -w`.
labels:
  tactic.id: TA0006
  tactic.name: Credential Access
  technique.id: T1555.001
  technique.name: Keychain
references:
  - https://attack.mitre.org/techniques/T1555/001/
condition: >
  spawn_process
  and ps.exe = '/usr/bin/security'
  and (
    ps.args = 'dump-keychain'
    or (ps.args in ('find-generic-password', 'find-internet-password') and ps.args regex '^-[a-zA-Z]*[wg][a-zA-Z]*$')
    or (ps.args = 'find-generic-password' and ps.cmdline icontains 'Safe Storage')
    or (ps.args = 'unlock-keychain' and ps.args = '-p')
    or (ps.args = 'export' and ps.args iin ('identities', 'privKeys', 'all'))
  )
output: "%ps.cmdline (pid %ps.pid, parent %ps.parent.exe) accessed keychain secrets"
severity: high
action: []
tests:
  atomic: [88e1fa00-bf63-4e5b-a3e1-e2ea51c8cca6]
min-engine-version: 0.1.0
