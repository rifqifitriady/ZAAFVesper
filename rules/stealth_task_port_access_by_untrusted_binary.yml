name: Task port, ptrace or remote thread from untrusted binary
id: f51f0c9f-b480-4a21-991f-2d1a2eec7576
version: 1.1.0
description: |
  A process without a verified developer identity (not an Apple platform binary and no
  Team ID with a Developer ID or App Store signing category: unsigned, ad-hoc,
  self-signed, a forged Team ID, or any Team ID when the category is not reported) obtained another process's task port (task_for_pid / get_task) or
  attached with ptrace, or any non-platform process created a thread in another process.
  These are the primitives for code injection and memory reading on macOS. Debuggers are
  Apple platform binaries (lldb) or carry Apple's Team ID 59GAB85EFG (Xcode/CLT
  debugserver, App Store category), and commercial tools that need task ports carry a
  Developer ID, so neither matches the task-port branch.
  Known benign: a developer's own ad-hoc built tool that inspects other processes.
labels:
  tactic.id: TA0005
  tactic.name: Stealth
  technique.id: T1055
  technique.name: Process Injection
references:
  - https://attack.mitre.org/techniques/T1055/
condition: >
  (
    (open_process or ptrace)
    and no_developer_identity
    and target.ps.pid > 1
  )
  or (remote_thread and ps.is_platform = false)
output: "%ps.exe (pid %ps.pid, signing %ps.signing_id) %evt.name on %target.ps.exe (pid %target.ps.pid)"
severity: high
action: []
tests:
  atomic: []
min-engine-version: 0.1.0
