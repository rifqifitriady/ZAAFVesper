<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" width="840" height="360" role="img" aria-labelledby="t d">
  <title id="t">ZAAFVesper roadmap</title>
  <desc id="d">Roadmap: v0.1 Foundation and v0.2 Platform are done, v0.3 Prove it live is in progress, v0.4 Trust and v0.5 Prevent are planned and need an Apple developer account and entitlement.</desc>
  <defs>
    <radialGradient id="bg" cx="0.7" cy="0.45" r="0.7"><stop offset="0" stop-color="#FF3EC8" stop-opacity="0.12"/><stop offset="1" stop-color="#FF3EC8" stop-opacity="0"/></radialGradient>
    <radialGradient id="bg2" cx="0.05" cy="0.0" r="0.6"><stop offset="0" stop-color="#9D6BFF" stop-opacity="0.22"/><stop offset="1" stop-color="#9D6BFF" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#1E2350"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.5"/></filter>
    <clipPath id="card"><rect width="840" height="360" rx="18"/></clipPath>
    <marker id="aT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1FE5C3"/></marker>
    <marker id="aM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#FF3EC8"/></marker>
    <marker id="aV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#9D6BFF"/></marker>
    <marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3B8EFF"/></marker>
  <linearGradient id="prog" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1FE5C3"/><stop offset="1" stop-color="#FF3EC8"/></linearGradient></defs>
  <style>
    text { font-family: ui-sans-serif, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif; }
    .ttl { font-size: 15px; font-weight: 700; fill: #FFFFFF; }
    .sub { font-size: 12px; fill: #B7B3D9; }
    .lbl { font-size: 12px; fill: #CFCBEA; }
    .box { fill: #12163A; stroke-width: 2; }
    .wire { fill: none; stroke-width: 2; stroke-linecap: round; }
    .move { stroke-dasharray: 8 7; animation: run 1.2s linear infinite; }
    .dash { stroke-dasharray: 5 6; animation: run 1.8s linear infinite; }
    @keyframes run { to { stroke-dashoffset: -30; } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.95; } }
    .draw { stroke-dasharray: 360; animation: draw 2.6s ease-out forwards; }
    @keyframes draw { from { stroke-dashoffset: 360; } to { stroke-dashoffset: 0; } }
    .ring { transform-box: fill-box; transform-origin: center; animation: ring 2.2s ease-out infinite; }
    @keyframes ring { from { opacity: .9; transform: scale(1); } to { opacity: 0; transform: scale(2.4); } }
    .card { opacity: 0; animation: up .7s ease-out forwards; }
    @keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .chip { font-size: 11.5px; font-weight: 700; letter-spacing: .6px; }
    .b { font-size: 12.5px; fill: #CFCBEA; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .packet { display: none; } }
  </style>
  <g clip-path="url(#card)">
    <rect width="840" height="360" fill="#0A0D26"/><rect width="840" height="360" fill="url(#dots)"/>
    <rect width="840" height="360" fill="url(#bg2)"/><rect width="840" height="360" fill="url(#bg)"/>
<text x="40" y="44" font-size="13" font-weight="700" letter-spacing="2.4" fill="#5EF0D6">ROADMAP</text><path d="M92 96 H748" stroke="#262B5E" stroke-width="4" stroke-linecap="round"/><path class="wire dash" d="M420 96 H748" stroke="#9D6BFF" stroke-width="3"/><path class="draw" d="M92 96 H420" stroke="url(#prog)" stroke-width="4" stroke-linecap="round" fill="none"/><circle cx="92" cy="96" r="11" fill="#1FE5C3" stroke="#1FE5C3" stroke-width="2.5"/><path d="M87 96 l3.5 3.5 l6.5 -7" fill="none" stroke="#0A0D26" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="72" text-anchor="middle" font-size="15" font-weight="800" fill="#1FE5C3">v0.1</text><g class="card" style="animation-delay:0.30s"><rect x="16" y="130" width="152" height="208" rx="14" fill="#12163A" stroke="#1FE5C3" stroke-width="2"/><text x="30" y="160" class="ttl">Foundation</text><rect x="30" y="172" width="103" height="22" rx="11" fill="#0F3B3A"/><text x="37" y="187" class="chip" fill="#1FE5C3">DONE · 7 NOV</text><circle cx="34" cy="220" r="3" fill="#1FE5C3"/><text x="44" y="224" class="b">eslogger + rule</text><text x="44" y="240" class="b">engine</text><circle cx="34" cy="260" r="3" fill="#1FE5C3"/><text x="44" y="264" class="b">41 macOS rules ·</text><text x="44" y="280" class="b">YARA</text><circle cx="34" cy="300" r="3" fill="#1FE5C3"/><text x="44" y="304" class="b">Installer ·</text><text x="44" y="320" class="b">LaunchDaemon</text></g><circle cx="256" cy="96" r="11" fill="#1FE5C3" stroke="#1FE5C3" stroke-width="2.5"/><path d="M251 96 l3.5 3.5 l6.5 -7" fill="none" stroke="#0A0D26" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="256" y="72" text-anchor="middle" font-size="15" font-weight="800" fill="#1FE5C3">v0.2</text><g class="card" style="animation-delay:0.55s"><rect x="180" y="130" width="152" height="208" rx="14" fill="#12163A" stroke="#1FE5C3" stroke-width="2"/><text x="194" y="160" class="ttl">Platform</text><rect x="194" y="172" width="103" height="22" rx="11" fill="#0F3B3A"/><text x="201" y="187" class="chip" fill="#1FE5C3">DONE · 9 NOV</text><circle cx="198" cy="220" r="3" fill="#1FE5C3"/><text x="208" y="224" class="b">Windows + Linux</text><text x="208" y="240" class="b">(Sysmon)</text><circle cx="198" cy="260" r="3" fill="#1FE5C3"/><text x="208" y="264" class="b">Sigma import ·</text><text x="208" y="280" class="b">network</text><circle cx="198" cy="300" r="3" fill="#1FE5C3"/><text x="208" y="304" class="b">SIEM · ZAAFElegia ·</text><text x="208" y="320" class="b">contain</text></g><circle class="ring" cx="420" cy="96" r="13" fill="none" stroke="#FF3EC8" stroke-width="2"/><circle cx="420" cy="96" r="13" fill="#FF3EC8" filter="url(#glow)" opacity=".7"/><circle cx="420" cy="96" r="11" fill="#FF3EC8" stroke="#FF3EC8" stroke-width="2.5"/><text x="420" y="72" text-anchor="middle" font-size="15" font-weight="800" fill="#FF3EC8">v0.3</text><g class="card" style="animation-delay:0.80s"><rect x="344" y="130" width="152" height="208" rx="14" fill="#12163A" stroke="#FF3EC8" stroke-width="2"/><text x="358" y="160" class="ttl">Prove it live</text><rect x="358" y="172" width="95" height="22" rx="11" fill="#3F1240"/><text x="365" y="187" class="chip" fill="#FF3EC8">IN PROGRESS</text><circle cx="362" cy="220" r="3" fill="#FF3EC8"/><text x="372" y="224" class="b">CI + signed</text><text x="372" y="240" class="b">provenance</text><circle cx="362" cy="260" r="3" fill="#FF3EC8"/><text x="372" y="264" class="b">Live tests on</text><text x="372" y="280" class="b">runners</text><circle cx="362" cy="300" r="3" fill="#FF3EC8"/><text x="372" y="304" class="b">Atomic Red Team</text><text x="372" y="320" class="b">proof</text></g><circle cx="584" cy="96" r="11" fill="#0A0D26" stroke="#9D6BFF" stroke-width="2.5" stroke-dasharray="4 3"/><text x="584" y="72" text-anchor="middle" font-size="15" font-weight="800" fill="#9D6BFF">v0.4</text><g class="card" style="animation-delay:1.05s"><rect x="508" y="130" width="152" height="208" rx="14" fill="#12163A" stroke="#9D6BFF" stroke-width="1.5" stroke-dasharray="4 3"/><text x="522" y="160" class="ttl">Trust</text><rect x="522" y="172" width="66" height="22" rx="11" fill="#221F4D"/><text x="529" y="187" class="chip" fill="#9D6BFF">PLANNED</text><circle cx="526" cy="220" r="3" fill="#9D6BFF"/><text x="536" y="224" class="b">Developer ID</text><text x="536" y="240" class="b">signing</text><circle cx="526" cy="260" r="3" fill="#9D6BFF"/><text x="536" y="264" class="b">Notarized package</text><circle cx="526" cy="300" r="3" fill="#9D6BFF"/><text x="536" y="304" class="b">Needs Apple account</text></g><circle cx="748" cy="96" r="11" fill="#0A0D26" stroke="#9D6BFF" stroke-width="2.5" stroke-dasharray="4 3"/><text x="748" y="72" text-anchor="middle" font-size="15" font-weight="800" fill="#9D6BFF">v0.5</text><g class="card" style="animation-delay:1.30s"><rect x="672" y="130" width="152" height="208" rx="14" fill="#12163A" stroke="#9D6BFF" stroke-width="1.5" stroke-dasharray="4 3"/><text x="686" y="160" class="ttl">Prevent</text><rect x="686" y="172" width="66" height="22" rx="11" fill="#221F4D"/><text x="693" y="187" class="chip" fill="#9D6BFF">PLANNED</text><circle cx="690" cy="220" r="3" fill="#9D6BFF"/><text x="700" y="224" class="b">AUTH blocking (ES)</text><circle cx="690" cy="260" r="3" fill="#9D6BFF"/><text x="700" y="264" class="b">DNS via</text><text x="700" y="280" class="b">NetworkExtension</text><circle cx="690" cy="300" r="3" fill="#9D6BFF"/><text x="700" y="304" class="b">Needs Apple</text><text x="700" y="320" class="b">entitlement</text></g>  </g>
  <rect x="0.75" y="0.75" width="838.5" height="358.5" rx="17.5" fill="none" stroke="#2E3470" stroke-width="1.5"/>
