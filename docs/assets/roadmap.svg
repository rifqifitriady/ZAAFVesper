ize="14">Platform</text><rect x="167" y="172" width="98" height="22" rx="11" fill="#0F3B3A"/><text x="173" y="187" class="chip" fill="#1FE5C3">DONE · 9 NOV</text><circle cx="170" cy="220" r="3" fill="#1FE5C3"/><text x="179" y="224" class="b" font-size="12">Windows +</text><text x="179" y="239" class="b" font-size="12">Linux</text><circle cx="170" cy="260" r="3" fill="#1FE5C3"/><text x="179" y="264" class="b" font-size="12">Sigma ·</text><text x="179" y="279" class="b" font-size="12">network</text><circle cx="170" cy="300" r="3" fill="#1FE5C3"/><text x="179" y="304" class="b" font-size="12">SIEM · contain</text></g><circle class="ring" cx="352" cy="96" r="13" fill="none" stroke="#FF3EC8" stroke-width="2"/><circle cx="352" cy="96" r="13" fill="#FF3EC8" filter="url(#glow)" opacity=".7"/><circle cx="352" cy="96" r="11" fill="#FF3EC8" stroke="#FF3EC8" stroke-width="2.5"/><text x="352" y="72" text-anchor="middle" font-size="15" font-weight="800" fill="#FF3EC8">v0.3</text><g class="card" style="animation-delay:0.80s"><rect x="290" y="130" width="124" height="208" rx="14" fill="#12163A" stroke="#FF3EC8" stroke-width="2"/><text x="302" y="160" class="ttl" font-size="14">Prove it live</text><rect x="302" y="172" width="34" height="22" rx="11" fill="#3F1240"/><text x="308" y="187" class="chip" fill="#FF3EC8">NOW</text><circle cx="305" cy="220" r="3" fill="#FF3EC8"/><text x="314" y="224" class="b" font-size="12">CI +</text><text x="314" y="239" class="b" font-size="12">provenance</text><circle cx="305" cy="260" r="3" fill="#FF3EC8"/><text x="314" y="264" class="b" font-size="12">Live tests on</text><text x="314" y="279" class="b" font-size="12">runners</text><circle cx="305" cy="300" r="3" fill="#FF3EC8"/><text x="314" y="304" class="b" font-size="12">Atomic Red</text><text x="314" y="319" class="b" font-size="12">Team</text></g><circle cx="487" cy="96" r="11" fill="#0A0D26" stroke="#3B8EFF" stroke-width="2.5" stroke-dasharray="4 3"/><text x="487" y="72" text-anchor="middle" fo