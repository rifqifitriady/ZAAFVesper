<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" width="840" height="360" role="img" aria-labelledby="t d">
  <title id="t">ZAAFVesper roadmap</title>
  <desc id="d">Roadmap: v0.1 Foundation and v0.2 Platform are done, v0.3 Prove it live is in progress, v0.4 Trust and v0.5 Prevent are planned and need an Apple developer account and entitlement.</desc>
