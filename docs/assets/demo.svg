<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="840" height="400" role="img" aria-labelledby="t d">
  <title id="t">zaafvesper replay demo</title>
  <desc id="d">Terminal recording: zaafvesper replay over the bundled eslogger test fixtures prints alerts with timestamp, severity, rule name and ATT&amp;CK technique, ending with an XProtect malware detection marked critical.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
    .row { opacity: 0; animation: show 14s linear infinite both; }
    @keyframes show { 0% { opacity: 0; } 1.5% { opacity: 1; } 86% { opacity: 1; } 90% { opacity: 0; } 100% { opacity: 0; } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .row { animation: none; opacity: 1; } .cursor { animation: none; } }
  </style>
  <rect x="0.75" y="0.75" width="838.5" height="398.5" rx="14" fill="#0B0E28" stroke="#2E3470" stroke-width="1.5"/>
  <path d="M1.5 40 H838.5" stroke="#20254F"/>
  <circle cx="26" cy="21" r="6" fill="#FF5F57"/><circle cx="46" cy="21" r="6" fill="#FEBC2E"/><circle cx="66" cy="21" r="6" fill="#28C840"/>
  <text x="420" y="25" text-anchor="middle" fill="#8F8BC2" font-size="12.5px">zaafvesper replay</text>
    <text class="row" style="animation-delay:0.4s" x="26" y="78"><tspan fill="#5EF0D6">$</tspan><tspan fill="#E9E7FF"> cat testdata/eslogger/*.jsonl &gt; demo.jsonl</tspan></text>
  <text class="row" style="animation-delay:1.4s" x="26" y="102"><tspan fill="#5EF0D6">$</tspan><tspan fill="#E9E7FF"> zaafvesper replay --rules rules demo.jsonl</tspan></text>
  <text class="row" style="animation-delay:2.4s" x="26" y="136"><tspan fill="#7F7BB3">2026-11-07T08:00:07Z</tspan><tspan x="206" fill="#FFB547" font-weight="700">MEDIUM</tspan><tspan x="290" fill="#E9E7FF">Shell start-up file modified by non-editor process</tspan><tspan x="814" text-anchor="end" fill="#9D8BFF">T1546.004</tspan></text>
  <text class="row" style="animation-delay:2.9s" x="26" y="160"><tspan fill="#7F7BB3">2026-11-07T08:00:06Z</tspan><tspan x="206" fill="#FF5FD2" font-weight="700">HIGH</tspan><tspan x="290" fill="#E9E7FF">Launch Agent persistence via plist write</tspan><tspan x="814" text-anchor="end" fill="#9D8BFF">T1543.001</tspan></text>
  <text class="row" style="animation-delay:3.3s" x="26" y="184"><tspan fill="#7F7BB3">2026-11-07T08:00:10Z</tspan><tspan x="206" fill="#FFB547" font-weight="700">MEDIUM</tspan><tspan x="290" fill="#E9E7FF">Quarantine attribute removed from file</tspan><tspan x="814" text-anchor="end" fill="#9D8BFF">T1553.001</tspan></text>
  <text class="row" style="animation-delay:3.8s" x="26" y="208"><tspan fill="#7F7BB3">2026-11-07T08:00:01Z</tspan><tspan x="206" fill="#FF5FD2" font-weight="700">HIGH</tspan><tspan x="290" fill="#E9E7FF">Process started with DYLD_INSERT_LIBRARIES</tspan><tspan x="814" text-anchor="end" fill="#9D8BFF">T1574.006</tspan></text>
  <text class="row" style="animation-delay:4.2s" x="26" y="232"><tspan fill="#7F7BB3">2026-11-07T08:00:12Z</tspan><tspan x="206" fill="#FF5FD2" font-weight="700">HIGH</tspan><tspan x="290" fill="#E9E7FF">Task port, ptrace or remote thread from untrusted binary</tspan><tspan x="814" text-anchor="end" fill="#9D8BFF">T1055</tspan></text>
  <text class="row" style="animation-delay:4.7s" x="26" y="256"><tspan fill="#7F7BB3">2026-11-07T08:00:05Z</tspan><tspan x="206" fill="#FF5FD2" font-weight="700">HIGH</tspan><tspan x="290" fill="#E9E7FF">Keychain database read by file tool or untrusted binary</tspan><tspan x="814" text-anchor="end" fill="#9D8BFF">T1555.001</tspan></text>
  <text class="row" style="animation-delay:5.1s" x="26" y="280"><tspan fill="#7F7BB3">2026-11-07T08:00:05Z</tspan><tspan x="206" fill="#FF5FD2" font-weight="700">HIGH</tspan><tspan x="290" fill="#E9E7FF">SSH or GnuPG private key read by unusual process</tspan><tspan x="814" text-anchor="end" fill="#9D8BFF">T1552.004</tspan></text>
  <text class="row" style="animation-delay:5.6s" x="26" y="304"><tspan fill="#7F7BB3">2026-11-07T08:00:09Z</tspan><tspan x="206" fill="#FF5FD2" font-weight="700">HIGH</tspan><tspan x="290" fill="#E9E7FF">System or audit logs cleared</tspan><tspan x="814" text-anchor="end" fill="#9D8BFF">T1685.006</tspan></text>
  <text class="row" style="animation-delay:6.0s" x="26" y="328"><tspan fill="#7F7BB3">2026-11-07T08:00:22Z</tspan><tspan x="206" fill="#FF4D6A" font-weight="700">CRITICAL</tspan><tspan x="290" fill="#E9E7FF">XProtect malware detection</tspan><tspan x="814" text-anchor="end" fill="#9D8BFF">T1204.002</tspan></text>
  <text class="row" style="animation-delay:6.5s" x="26" y="362" fill="#7F7BB3">replay: demo.jsonl format=eslogger</text>
  <rect class="cursor" x="26" y="372" width="8" height="16" fill="#5EF0D6"/>
</svg>
