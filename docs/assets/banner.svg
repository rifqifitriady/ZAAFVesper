<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 280" width="840" height="280" role="img" aria-labelledby="t d">
  <title id="t">ZAAFVesper</title>
  <desc id="d">ZAAFVesper, a behaviour-driven security sensor for macOS. An evening star watches a stream of system events and flags the one that matches a rule.</desc>
  <defs>
    <radialGradient id="glowV" cx="0.08" cy="0.05" r="0.75">
      <stop offset="0" stop-color="#9D6BFF" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#9D6BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowM" cx="0.86" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF3EC8" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FF3EC8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9B4FF"/>
      <stop offset="0.45" stop-color="#FF7ADB"/>
      <stop offset="1" stop-color="#5EF0D6"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.25 0; 0.25 0; -0.25 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="star" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.35" stop-color="#FFD8F4"/>
      <stop offset="1" stop-color="#FF3EC8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1FE5C3" stop-opacity="0"/>
      <stop offset="1" stop-color="#1FE5C3" stop-opacity="0.55"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2A2F5C"/>
    </pattern>
    <clipPath id="card"><rect width="840" height="280" rx="18"/></clipPath>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <style>
    .sans { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .ring { transform-origin: 668px 140px; animation: ripple 4.5s ease-out infinite; }
    .ring.r2 { animation-delay: 1.5s; }
    .ring.r3 { animation-delay: 3s; }
    @keyframes ripple { 0% { transform: scale(0.25); opacity: 0.9; } 100% { transform: scale(1.6); opacity: 0; } }
    .core { transform-origin: 668px 140px; animation: breathe 3.2s ease-in-out infinite; }
    @keyframes breathe { 0%, 100% { transform: scale(0.92); } 50% { transform: scale(1.08); } }
    .arm { transform-origin: 668px 140px; animation: spin 7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .flow { stroke-dasharray: 3 13; animation: flow 1.6s linear infinite; }
    .flow.f2 { animation-duration: 2.1s; }
    .flow.f3 { animation-duration: 1.3s; }
    .flow.f4 { animation-duration: 2.6s; }
    @keyframes flow { to { stroke-dashoffset: -32; } }
    .hit { animation: hit 4.5s ease-in-out infinite; }
    @keyframes hit { 0%, 55% { opacity: 0; } 62%, 80% { opacity: 1; } 100% { opacity: 0; } }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .ring, .core, .arm, .flow, .hit, .cursor { animation: none; }
      .hit { opacity: 1; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="840" height="280" fill="#0A0D26"/>
    <rect width="840" height="280" fill="url(#dots)"/>
    <rect width="840" height="280" fill="url(#glowV)"/>
    <rect width="840" height="280" fill="url(#glowM)"/>

    <!-- event streams flowing into the watch -->
    <g fill="none" stroke-width="2" stroke-linecap="round">
      <path class="flow" d="M480 78 C 550 78, 560 118, 640 132" stroke="#9D6BFF"/>
      <path class="flow f2" d="M480 116 C 550 116, 570 134, 640 138" stroke="#1FE5C3"/>
      <path class="flow f3" d="M480 166 C 550 166, 570 146, 640 142" stroke="#3B8EFF"/>
      <path class="flow f4" d="M480 206 C 550 206, 560 162, 640 148" stroke="#FF3EC8"/>
    </g>

    <!-- radar: rings, sweep arm, star -->
    <g fill="none" stroke="#FF3EC8" stroke-width="1.5">
      <circle class="ring" cx="668" cy="140" r="70"/>
      <circle class="ring r2" cx="668" cy="140" r="70"/>
      <circle class="ring r3" cx="668" cy="140" r="70"/>
    </g>
    <circle cx="668" cy="140" r="96" fill="none" stroke="#2E3470" stroke-width="1"/>
    <circle cx="668" cy="140" r="60" fill="none" stroke="#2E3470" stroke-width="1"/>
    <g class="arm"><path d="M668 140 L764 140 A96 96 0 0 0 736 72 Z" fill="url(#sweep)" opacity="0.6"/></g>
    <g class="core">
      <circle cx="668" cy="140" r="34" fill="url(#star)"/>
      <path d="M668 112 L673 135 L696 140 L673 145 L668 168 L663 145 L640 140 L663 135 Z" fill="#FFFFFF"/>
    </g>

    <!-- a detection flag -->
    <g class="hit">
      <circle cx="736" cy="72" r="6" fill="#FF3EC8" filter="url(#soft)"/>
      <circle cx="736" cy="72" r="3.5" fill="#FFFFFF"/>
      <rect x="750" y="54" width="72" height="24" rx="12" fill="#FF3EC8"/>
      <text x="786" y="71" text-anchor="middle" class="mono" font-size="12.5" font-weight="700" fill="#0A0D26">T1543</text>
    </g>

    <!-- copy -->
    <text x="44" y="64" class="sans" font-size="13" font-weight="700" letter-spacing="2.4" fill="#5EF0D6">MACOS · ENDPOINT SECURITY · MITRE ATT&amp;CK</text>
    <text x="42" y="132" class="sans" font-size="58" font-weight="800" fill="url(#title)">ZAAFVesper</text>
    <text x="44" y="170" class="sans" font-size="18" fill="#D6D3F2">Behaviour-driven security sensor for macOS.</text>
    <text x="44" y="196" class="sans" font-size="18" fill="#A9A5D6">The evening watch that stays awake after dark.</text>
    <text x="44" y="240" class="mono" font-size="14" fill="#8F8BC2">events <tspan fill="#FF7ADB">→</tspan> rules <tspan fill="#FF7ADB">→</tspan> ATT&amp;CK <tspan fill="#FF7ADB">→</tspan> alert · respond<tspan class="cursor" fill="#5EF0D6"> ▍</tspan></text>
  </g>
  <rect x="0.75" y="0.75" width="838.5" height="278.5" rx="17.5" fill="none" stroke="#2E3470" stroke-width="1.5"/>
</svg>
