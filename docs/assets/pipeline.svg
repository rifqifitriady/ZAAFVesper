<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" width="840" height="470" role="img" aria-labelledby="t d">
  <title id="t">How ZAAFVesper works</title>
  <desc id="d">Events from macOS Endpoint Security, Windows Sysmon, Linux Sysmon and socket polling are normalised, enriched by the process tree and evaluated by the rule engine with YARA and Sigma rules. Matches become alerts, SIEM and ZAAFElegia output, opt-in containment and a forensic capture.</desc>
  <defs>
    <radialGradient id="bg" cx="0.7" cy="0.45" r="0.7"><stop offset="0" stop-color="#FF3EC8" stop-opacity="0.12"/><stop offset="1" stop-color="#FF3EC8" stop-opacity="0"/></radialGradient>
    <radialGradient id="bg2" cx="0.05" cy="0.0" r="0.6"><stop offset="0" stop-color="#9D6BFF" stop-opacity="0.22"/><stop offset="1" stop-color="#9D6BFF" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#1E2350"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.5"/></filter>
    <clipPath id="card"><rect width="840" height="470" rx="18"/></clipPath>
    <marker id="aT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1FE5C3"/></marker>
    <marker id="aM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#FF3EC8"/></marker>
    <marker id="aV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#9D6BFF"/></marker>
    <marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3B8EFF"/></marker>
  </defs>
  <style>
    text { font-family: ui-sans-serif, -apple-system, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif; }
    .ttl { font-size: 15px; font-weight: 700; fill: #FFFFFF; }
    .sub { font-size: 12px; fill: #B7B3D9; }
    .lbl { font-size: 12px; fill: #CFCBEA; }
    .box { fill: #12163A; stroke-width: 2; }
    .wire { fill: none; stroke-width: 2; stroke-linecap: round; }
    .move { stroke-dasharray: 8 7; animation: run 1.2s linear infinite; }
    .dash { stroke-dasharray: 5 6; animation: run 1.8s linear infinite; }
    @keyframes run { to { stroke-dashoffset: -30; } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.95; } }
    
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .packet { display: none; } }
  </style>
  <g clip-path="url(#card)">
    <rect width="840" height="470" fill="#0A0D26"/><rect width="840" height="470" fill="url(#dots)"/>
    <rect width="840" height="470" fill="url(#bg2)"/><rect width="840" height="470" fill="url(#bg)"/>
<path class="wire move" d="M200 60 C218 60, 212 145, 228 145" stroke="#9D6BFF" marker-end="url(#aV)"/><path class="wire move" d="M200 160 C218 160, 212 145, 228 145" stroke="#9D6BFF" marker-end="url(#aV)"/><path class="wire move" d="M200 260 C218 260, 212 145, 228 145" stroke="#9D6BFF" marker-end="url(#aV)"/><path class="wire move" d="M200 360 C218 360, 212 145, 228 145" stroke="#9D6BFF" marker-end="url(#aV)"/><path class="wire move" d="M316 182 V226" stroke="#1FE5C3" marker-end="url(#aT)"/><path class="wire move" d="M404 262 C418 262, 418 215, 432 215" stroke="#1FE5C3" marker-end="url(#aT)"/><path class="wire dash" d="M517 104 V166" stroke="#9D6BFF" marker-end="url(#aV)"/><path class="wire dash" d="M517 328 V266" stroke="#9D6BFF" marker-end="url(#aV)"/><path class="wire move" d="M602 215 C616 215, 616 50, 630 50" stroke="#3B8EFF" marker-end="url(#aB)"/><path class="wire move" d="M602 215 C616 215, 616 136, 630 136" stroke="#3B8EFF" marker-end="url(#aB)"/><path class="wire move" d="M602 215 C616 215, 616 222, 630 222" stroke="#1FE5C3" marker-end="url(#aT)"/><path class="wire move" d="M602 215 C616 215, 616 308, 630 308" stroke="#FF3EC8" marker-end="url(#aM)"/><path class="wire move" d="M602 215 C616 215, 616 394, 630 394" stroke="#1FE5C3" marker-end="url(#aT)"/><g class="packet"><circle r="4" fill="#5EF0D6" filter="url(#glow)"><animateMotion dur="3.4s" begin="0.0s" repeatCount="indefinite" path="M200 60 C218 60, 212 145, 228 145 H316 V262 H404 C418 262, 418 215, 517 215"/></circle><circle r="4" fill="#5EF0D6" filter="url(#glow)"><animateMotion dur="3.4s" begin="0.6s" repeatCount="indefinite" path="M200 160 C218 160, 212 145, 228 145 H316 V262 H404 C418 262, 418 215, 517 215"/></circle><circle r="4" fill="#5EF0D6" filter="url(#glow)"><animateMotion dur="3.4s" begin="1.2s" repeatCount="indefinite" path="M200 260 C218 260, 212 145, 228 145 H316 V262 H404 C418 262, 418 215, 517 215"/></circle><circle r="4" fill="#5EF0D6" filter="url(#glow)"><animateMotion dur="3.4s" begin="1.8s" repeatCount="indefinite" path="M200 360 C218 360, 212 145, 228 145 H316 V262 H404 C418 262, 418 215, 517 215"/></circle><circle r="3.5" fill="#3B8EFF"><animateMotion dur="2.2s" begin="0.40s" repeatCount="indefinite" path="M602 215 C616 215, 616 50, 830 50"/></circle><circle r="3.5" fill="#3B8EFF"><animateMotion dur="2.2s" begin="0.85s" repeatCount="indefinite" path="M602 215 C616 215, 616 136, 830 136"/></circle><circle r="3.5" fill="#1FE5C3"><animateMotion dur="2.2s" begin="1.30s" repeatCount="indefinite" path="M602 215 C616 215, 616 222, 830 222"/></circle><circle r="3.5" fill="#FF3EC8"><animateMotion dur="2.2s" begin="1.75s" repeatCount="indefinite" path="M602 215 C616 215, 616 308, 830 308"/></circle><circle r="3.5" fill="#1FE5C3"><animateMotion dur="2.2s" begin="2.20s" repeatCount="indefinite" path="M602 215 C616 215, 616 394, 830 394"/></circle></g><rect class="box" x="20" y="28" width="180" height="64" rx="12" stroke="#9D6BFF"/><text x="36" y="55" class="ttl">macOS</text><text x="36" y="75" class="sub">Endpoint Security</text><rect class="box" x="20" y="128" width="180" height="64" rx="12" stroke="#9D6BFF" stroke-dasharray="6 5"/><text x="36" y="155" class="ttl">Windows</text><text x="36" y="175" class="sub">Sysmon · preview</text><rect class="box" x="20" y="228" width="180" height="64" rx="12" stroke="#9D6BFF" stroke-dasharray="6 5"/><text x="36" y="255" class="ttl">Linux</text><text x="36" y="275" class="sub">Sysmon for Linux · preview</text><rect class="box" x="20" y="328" width="180" height="64" rx="12" stroke="#9D6BFF" stroke-dasharray="6 5"/><text x="36" y="355" class="ttl">Network</text><text x="36" y="375" class="sub">socket polling</text><rect class="box" x="228" y="108" width="176" height="74" rx="12" stroke="#1FE5C3"/><text x="244" y="135" class="ttl">Normalise</text><text x="244" y="155" class="sub">one event model · caps</text><rect class="box" x="228" y="226" width="176" height="74" rx="12" stroke="#1FE5C3"/><text x="244" y="253" class="ttl">Process tree</text><text x="244" y="273" class="sub">ancestry · signing trust</text><rect class="box" x="432" y="40" width="170" height="64" rx="12" stroke="#9D6BFF"/><text x="448" y="67" class="ttl">YARA</text><text x="448" y="87" class="sub">bound to the file that ran</text><rect class="box" x="432" y="328" width="170" height="64" rx="12" stroke="#9D6BFF"/><text x="448" y="355" class="ttl">Sigma rules</text><text x="448" y="375" class="sub">converted from SigmaHQ</text><rect class="pulse" x="428" y="162" width="178" height="108" rx="16" fill="none" stroke="#FF3EC8" stroke-width="2" filter="url(#glow)"/><rect class="box" x="432" y="166" width="170" height="100" rx="12" stroke="#FF3EC8"/><text x="448" y="193" class="ttl">Rule engine</text><text x="448" y="213" class="sub">94 rules · sequences</text><text x="448" y="236" class="sub">63 ATT&amp;CK techniques</text><rect class="box" x="630" y="22" width="200" height="56" rx="12" stroke="#3B8EFF"/><text x="644" y="45" class="ttl">Alerts</text><text x="644" y="64" class="sub">console · JSONL · high series</text><rect class="box" x="630" y="108" width="200" height="56" rx="12" stroke="#3B8EFF"/><text x="644" y="131" class="ttl">SIEM</text><text x="644" y="150" class="sub">syslog/TLS · webhook · HEC</text><rect class="box" x="630" y="194" width="200" height="56" rx="12" stroke="#1FE5C3"/><text x="644" y="217" class="ttl">ZAAFElegia</text><text x="644" y="236" class="sub">Sigma fields · OCSF</text><rect class="box" x="630" y="280" width="200" height="56" rx="12" stroke="#FF3EC8"/><text x="644" y="303" class="ttl">Contain</text><text x="644" y="322" class="sub">kill · quarantine · pf · opt-in</text><rect class="box" x="630" y="366" width="200" height="56" rx="12" stroke="#1FE5C3"/><text x="644" y="389" class="ttl">Capture</text><text x="644" y="408" class="sub">.rcap for replay</text>  </g>
  <rect x="0.75" y="0.75" width="838.5" height="468.5" rx="17.5" fill="none" stroke="#2E3470" stroke-width="1.5"/>
