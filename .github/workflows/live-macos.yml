name: live-macos
on:
  workflow_dispatch:
  push:
    branches: ['validate/**']
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Probe runner
        run: scripts/ci/live-macos/probe.sh
